<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "Cascadia Mono", "Microsoft YaHei", monospace;
  --bg:#ffffff; --bg-soft:#f6f8fa; --bg-sub:#eef1f4;
  --border:#d0d7de; --border-soft:#e6eaef;
  --text:#1f2328; --muted:#656d76;
  --accent:#0969da; --accent-soft:#ddf4ff; --accent-fg:#ffffff;
  --add-bg:#d9f7e4; --add-line:#b3ecc7; --add-word:#7fdda0; --add-bar:#2da44e;
  --del-bg:#ffe1e1; --del-line:#ffc6c6; --del-word:#ff9d9d; --del-bar:#e5534b;
  --green:#1a7f37; --green-h:#15702f; --red:#cf222e;
  --warn-bg:#fff3c4; --warn-fg:#7a4f01;
  /* 对齐常量：JS 启动时从这里读取，不要在脚本里再写死 */
  --lh: 20px;
  --pt: 8px;
  --pl: 12px;
  /* 行号列宽度 = 符号列 + 间隙 + 右内边距 + N 位数字，三者同源，改一处即可 */
  --signw: 13px;
  --gutgap: 3px;
  --gutpad: 8px;
  --lnw: calc(var(--signw) + var(--gutgap) + var(--gutpad) + 3ch);
}
html[data-theme="dark"]{
  --bg:#0d1117; --bg-soft:#161b22; --bg-sub:#1c2129;
  --border:#30363d; --border-soft:#21262d;
  --text:#e6edf3; --muted:#8b949e;
  --accent:#2f81f7; --accent-soft:#0d2d63; --accent-fg:#ffffff;
  --add-bg:#123a25; --add-line:#1a5233; --add-word:#2c9155; --add-bar:#3fb950;
  --del-bg:#3d161a; --del-line:#5c2026; --del-word:#a03740; --del-bar:#f85149;
  --green:#238636; --green-h:#2ea043; --red:#f85149;
  --warn-bg:#3a2d00; --warn-fg:#e3b341;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px; display:flex; flex-direction:column; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---------- 顶栏 ---------- */
.topbar{
  flex:0 0 auto; display:flex; align-items:center; flex-wrap:wrap; gap:8px;
  padding:7px 13px; background:var(--bg-soft); border-bottom:1px solid var(--border);
}
.brand{display:flex; align-items:baseline; gap:7px; font-weight:600; letter-spacing:.2px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);align-self:center}
.brand .sub{font-weight:400; font-size:12px; color:var(--muted)}
.spacer{margin-left:auto}
button{
  font:inherit; font-size:13px; padding:4px 11px; border-radius:6px; cursor:pointer;
  border:1px solid var(--border); background:var(--bg); color:var(--text);
  transition:background .12s, border-color .12s; white-space:nowrap;
}
button:hover{background:var(--bg-sub)}
button:active{transform:translateY(.5px)}
button.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-fg); font-weight:500}
button.primary:hover{filter:brightness(1.08); background:var(--accent)}
label.chk{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; color:var(--muted); cursor:pointer; user-select:none; white-space:nowrap}
label.chk input{accent-color:var(--accent); margin:0; cursor:pointer}

.pill{
  display:inline-flex; align-items:center; padding:1px 8px; border-radius:20px;
  font-variant-numeric:tabular-nums; font-weight:600; font-size:11.5px;
}
.pill.add{background:var(--add-bg); color:var(--green)}
.pill.del{background:var(--del-bg); color:var(--red)}
.pill.mod{background:var(--accent-soft); color:var(--accent)}
.pill.same{background:var(--bg-sub); color:var(--muted)}
.pill.warn{background:var(--warn-bg); color:var(--warn-fg); font-weight:600; cursor:help}
.pill.warn[hidden]{display:none}
.stat-inline{display:flex; align-items:center; gap:5px; margin-left:4px}
/* 差异跳转：紧凑按钮 + 位置指示，塞进统计区，不额外占一行 */
.nav{
  font-size:12px; line-height:16px; padding:0 6px; border-radius:4px; cursor:pointer;
  border:1px solid var(--border); background:var(--bg); color:var(--text);
  font-variant-numeric:tabular-nums;
}
.nav:hover:not(:disabled){background:var(--bg-sub)}
.nav:disabled{opacity:.35; cursor:default}
.navpos{font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; min-width:34px; text-align:center}
select.enc{
  font:inherit; font-size:11.5px; padding:1px 2px; border-radius:5px; cursor:pointer;
  border:1px solid var(--border); background:var(--bg-soft); color:var(--muted);
}
select.enc:hover{background:var(--bg-sub)}

/* ---------- 双栏编辑区（自带差异高亮）---------- */
.workspace{flex:1 1 auto; min-height:0; display:grid; grid-template-columns:1fr 1fr; background:var(--bg-soft)}
.pane{display:flex; flex-direction:column; min-width:0; min-height:0}
.pane + .pane{border-left:1px solid var(--border)}
.pane-head{
  flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:4px 10px;
  font-size:12px; color:var(--muted); background:var(--bg); border-bottom:1px solid var(--border-soft);
}
.pane-head .label{margin-right:auto; font-weight:600; color:var(--text)}
.pane-head .count{font-variant-numeric:tabular-nums}
.mini{
  font-size:12px; padding:2px 9px; border-radius:5px; cursor:pointer;
  border:1px solid var(--border); background:var(--bg-soft); color:var(--text);
}
.mini:hover{background:var(--bg-sub)}

.editor{flex:1 1 auto; min-height:0; display:flex; background:var(--bg); overflow:hidden; position:relative}

/* 行号列 */
.gutter{
  flex:0 0 auto; width:var(--lnw); overflow:hidden; position:relative;
  background:var(--bg-soft); border-right:1px solid var(--border-soft);
  font-family:var(--mono); font-size:12px;   /* 与 .gn 同源，--lnw 里的 ch 才准 */
}
.gutter-inner{position:absolute; top:0; left:0; width:100%; will-change:transform}
.gn{
  position:absolute; right:0; left:0; height:var(--lh); line-height:var(--lh);
  text-align:right; padding-right:var(--gutpad); padding-left:calc(var(--signw) + var(--gutgap));
  font-family:var(--mono);
  font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums;
}
.gn::before{
  position:absolute; left:0; top:0; width:var(--signw); text-align:center;
  font-weight:700; font-size:12px; color:transparent;
}
.gn.del{background:var(--del-line); color:var(--red)}
.gn.del::before{content:'\2212'; color:var(--del-bar)}
.gn.ins{background:var(--add-line); color:var(--green)}
.gn.ins::before{content:'+'; color:var(--add-bar)}
/* 修改行：底色/配色沿用该侧 del|ins，符号改成 ~（与统计 pill 的语义一致）。
   必须写在上面两条 ::before 之后，同优先级靠顺序覆盖 content；color 继续沿用该侧的 --*-bar。 */
.gn.mod::before{content:'~'}

/* 代码区 */
.code-wrap{flex:1 1 auto; position:relative; min-width:0; overflow:hidden}
.hl-bg{position:absolute; inset:0; overflow:hidden; pointer-events:none; will-change:transform}
.hl-line{position:absolute; left:0; right:0; height:var(--lh)}
.hl-line.del{background:var(--del-bg); box-shadow:inset 3px 0 0 var(--del-bar)}
.hl-line.ins{background:var(--add-bg); box-shadow:inset 3px 0 0 var(--add-bar)}

/* ===== 字形声明只写一处 =====
   textarea 与「影子文本」必须逐项一致（字体/字号/行高/字距/tab 宽度/空白策略），
   否则字符级色块会整体错位。任何一项改动都只改这条规则。 */
textarea.src, .hl-chars .hline{
  font-family:var(--mono); font-size:12.5px; line-height:var(--lh);
  letter-spacing:0; tab-size:4; white-space:pre;
}

.hl-chars{
  position:absolute; top:var(--pt); left:var(--pl);
  pointer-events:none; will-change:transform;
}
.hl-chars .hline{position:absolute; left:0}
.hl-chars .c{color:transparent}
.hl-chars .w-del{background:var(--del-word); border-radius:2px; color:transparent}
.hl-chars .w-ins{background:var(--add-word); border-radius:2px; color:transparent}

/* 只保留布局/skin 属性，字形属性见上方共享规则 */
textarea.src{
  position:absolute; inset:0; width:100%; height:100%;
  padding:var(--pt) var(--pl);
  border:0; outline:none; resize:none; background:transparent; color:var(--text);
  overflow:auto;
}
textarea.src.drag{background:var(--accent-soft)}
textarea.src::placeholder{color:var(--muted)}

/* ---------- 详细对比面板（按需打开）---------- */
.detail{position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; background:var(--bg)}
.detail[hidden]{display:none}
.detail-head{
  flex:0 0 auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:7px 13px; background:var(--bg-soft); border-bottom:1px solid var(--border);
}
.detail-head .title{font-weight:600; font-size:13.5px}
.detail-head .meta{color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums}
.diff-view{
  flex:1 1 auto; min-height:0; overflow:auto; background:var(--bg);
  font-family:var(--mono); font-size:12.5px; line-height:1.65;
}
.row{display:flex; align-items:stretch; min-height:1.65em}
.cell{display:flex; flex:1 1 0; min-width:0}
.cell.left{border-right:1px solid var(--border)}
.ln{
  flex:0 0 auto; width:var(--lnw); padding:0 8px 0 4px; text-align:right;
  color:var(--muted); background:var(--bg-soft); border-right:1px solid var(--border-soft);
  user-select:none; font-variant-numeric:tabular-nums; font-size:12px;
}
.tx{flex:1 1 auto; min-width:0; padding:0 10px; white-space:pre-wrap; word-break:break-word; min-height:1.65em}
.row.del .cell.left{background:var(--del-bg)}
.row.del .cell.left .ln{background:var(--del-line); color:var(--red)}
.row.ins .cell.right{background:var(--add-bg)}
.row.ins .cell.right .ln{background:var(--add-line); color:var(--green)}
.row.mod .cell.left{background:var(--del-bg)}
.row.mod .cell.left .ln{background:var(--del-line); color:var(--red)}
.row.mod .cell.right{background:var(--add-bg)}
.row.mod .cell.right .ln{background:var(--add-line); color:var(--green)}
.cell.empty{background-image:repeating-linear-gradient(-45deg, var(--bg-soft) 0 7px, transparent 7px 14px)}
.cell.empty .ln{background:transparent}
.w-del-mark{background:var(--del-word); border-radius:2px; padding:0 1px}
.w-ins-mark{background:var(--add-word); border-radius:2px; padding:0 1px}

.fold{
  display:flex; align-items:center; justify-content:center; padding:3px 0;
  background:var(--bg-soft); border-top:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft);
}
.fold button{font-size:11.5px; padding:1px 12px; border-radius:20px; color:var(--accent); background:var(--bg); border:1px solid var(--border)}
.fold button:hover{background:var(--accent-soft)}
.placeholder{
  display:flex; align-items:center; justify-content:center; height:100%;
  color:var(--muted); font-size:13px; text-align:center; padding:24px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
}

@media (max-width: 860px){
  .workspace{grid-template-columns:1fr; grid-template-rows:1fr 1fr}
  .pane + .pane{border-left:0; border-top:1px solid var(--border)}
  .brand .sub{display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span>Diff Viewer<span class="sub">本地文本对比</span></div>

  <div class="stat-inline" id="statInline">
    <span class="pill add" id="pAdd">+0</span>
    <span class="pill del" id="pDel">−0</span>
    <span class="pill mod" id="pMod">~0</span>
    <span class="pill same" id="pSame">=0</span>
    <span class="pill warn" id="pWarn" hidden>⚠ 已降级对齐</span>
    <button class="nav" id="navPrev" title="上一处差异 (Alt+↑)" disabled>↑</button>
    <button class="nav" id="navNext" title="下一处差异 (Alt+↓)" disabled>↓</button>
    <span class="navpos" id="navPos" title="当前差异位置">0/0</span>
  </div>

  <span class="spacer"></span>

  <label class="chk"><input type="checkbox" id="optWs"> 忽略空白</label>
  <button id="btnSwap" title="交换左右两侧文本">交换</button>
  <button id="btnSample">示例</button>
  <button id="btnClear">清空</button>
  <button id="btnTheme" title="切换浅色/深色">深色</button>
  <button id="btnDetail" class="primary" title="打开并排详细对比 (Ctrl+Enter)">详细对比</button>
</header>

<main class="workspace">

  <section class="pane">
    <div class="pane-head">
      <span class="label">原始文本</span>
      <span class="count" id="cntL">0 行</span>
      <select class="enc" id="encL" title="文件编码（仅对已加载的文件生效）">
        <option value="auto">自动</option>
        <option value="utf-8">UTF-8</option>
        <option value="gbk">GBK</option>
      </select>
      <label class="mini">选择文件<input type="file" id="fileL" hidden></label>
      <button class="mini" data-clear="L">清空</button>
    </div>
    <div class="editor">
      <div class="gutter"><div class="gutter-inner" id="gutL"></div></div>
      <div class="code-wrap">
        <div class="hl-bg" id="bgL"></div>
        <div class="hl-chars" id="chL"></div>
        <textarea class="src" id="taL" wrap="off" spellcheck="false" placeholder="粘贴原始文本，或拖入文件…"></textarea>
      </div>
    </div>
  </section>

  <section class="pane">
    <div class="pane-head">
      <span class="label">对比文本</span>
      <span class="count" id="cntR">0 行</span>
      <select class="enc" id="encR" title="文件编码（仅对已加载的文件生效）">
        <option value="auto">自动</option>
        <option value="utf-8">UTF-8</option>
        <option value="gbk">GBK</option>
      </select>
      <label class="mini">选择文件<input type="file" id="fileR" hidden></label>
      <button class="mini" data-clear="R">清空</button>
    </div>
    <div class="editor">
      <div class="gutter"><div class="gutter-inner" id="gutR"></div></div>
      <div class="code-wrap">
        <div class="hl-bg" id="bgR"></div>
        <div class="hl-chars" id="chR"></div>
        <textarea class="src" id="taR" wrap="off" spellcheck="false" placeholder="粘贴新文本，或拖入文件…"></textarea>
      </div>
    </div>
  </section>

</main>

<!-- 详细对比：并排 + 字符级高亮 + 折叠，按需打开 -->
<div class="detail" id="detail" hidden>
  <div class="detail-head">
    <span class="title">并排详细对比</span>
    <span class="meta" id="detailMeta"></span>
    <span class="spacer"></span>
    <label class="chk"><input type="checkbox" id="optFold" checked> 折叠未变更</label>
    <button id="btnCloseDetail">关闭</button>
  </div>
  <div class="diff-view" id="diffView"></div>
</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var taL = $('taL'), taR = $('taR');

  /* 对齐常量从 CSS 自定义属性读取，避免与样式表两处硬编码不同步。
     （script 在 body 末尾执行，样式已生效；取不到时按默认值兜底。） */
  function cssPx(name, dflt) {
    var v = '';
    try { v = getComputedStyle(document.documentElement).getPropertyValue(name); } catch (e) { v = ''; }
    var n = parseFloat(v);
    return isFinite(n) ? n : dflt;
  }
  var LH = cssPx('--lh', 20);
  var PAD_T = cssPx('--pt', 8);
  var PAD_L = cssPx('--pl', 12);

  var FOLD_CTX = 3;
  var CHAR_DIFF_LIMIT = 3000;
  var CHAR_DIFF_LIMIT_OPS = 256;   // 字符级 Myers 的层数上限（行级是 1200）

  /* =========================================================
   * 1. 差异内核（Myers O(ND)，带前后缀裁剪与降级保护）
   * =======================================================*/
  /* 返回 { ops, degraded }。degraded 为 true 表示编辑距离超出 limit，
     结果已退化为「全删 + 全增」，调用方必须把这件事告诉用户。 */
  function myers(a, b, eq, limit) {
    var n = a.length, m = b.length;
    if (n === 0 && m === 0) return { ops: [], degraded: false };
    if (n === 0) { var r1 = [], i1; for (i1 = 0; i1 < m; i1++) r1.push({ t: 2, bi: i1 }); return { ops: r1, degraded: false }; }
    if (m === 0) { var r2 = [], i2; for (i2 = 0; i2 < n; i2++) r2.push({ t: 1, ai: i2 }); return { ops: r2, degraded: false }; }

    var max = n + m;
    var LIMIT = Math.min(max, limit || 1200);
    var off = max + 1;
    var v = new Int32Array(2 * max + 3);
    var trace = [];
    var d = 0, done = false, k, x, y;

    for (; d <= LIMIT; d++) {
      trace.push(d === 0 ? null : v.slice(off - (d - 1), off + (d - 1) + 1));
      done = false;
      for (k = -d; k <= d; k += 2) {
        if (k === -d || (k !== d && v[off + k - 1] < v[off + k + 1])) x = v[off + k + 1];
        else x = v[off + k - 1] + 1;
        y = x - k;
        while (x < n && y < m && eq(a[x], b[y])) { x++; y++; }
        v[off + k] = x;
        if (x >= n && y >= m) { done = true; break; }
      }
      if (done) break;
    }

    if (!done) {
      var fb = [], i;
      for (i = 0; i < n; i++) fb.push({ t: 1, ai: i });
      for (i = 0; i < m; i++) fb.push({ t: 2, bi: i });
      return { ops: fb, degraded: true };
    }

    var ops = [];
    x = n; y = m;
    for (var dd = d; dd > 0; dd--) {
      var snap = trace[dd];
      var base = dd - 1;
      var get = function (kk) { return snap[kk + base]; };
      var kk2 = x - y;
      var prevK;
      if (kk2 === -dd || (kk2 !== dd && get(kk2 - 1) < get(kk2 + 1))) prevK = kk2 + 1;
      else prevK = kk2 - 1;
      var prevX = get(prevK);
      var prevY = prevX - prevK;
      while (x > prevX && y > prevY) { ops.push({ t: 0, ai: x - 1, bi: y - 1 }); x--; y--; }
      if (x > prevX) { ops.push({ t: 1, ai: x - 1 }); x--; }
      else { ops.push({ t: 2, bi: y - 1 }); y--; }
    }
    while (x > 0 && y > 0) { ops.push({ t: 0, ai: --x, bi: --y }); }
    while (x > 0) { ops.push({ t: 1, ai: --x }); }
    while (y > 0) { ops.push({ t: 2, bi: --y }); }
    ops.reverse();
    return { ops: ops, degraded: false };
  }

  /* flags 可选：仅行级比对传，用于把「降级」透传给 UI。
     字符级比对不传，避免一行字符级超限被误报成整体降级。 */
  function diffCore(a, b, eq, flags, limit) {
    var n = a.length, m = b.length;
    var pre = 0;
    while (pre < n && pre < m && eq(a[pre], b[pre])) pre++;
    var suf = 0;
    while (suf < n - pre && suf < m - pre && eq(a[n - 1 - suf], b[m - 1 - suf])) suf++;

    var A = a.slice(pre, n - suf), B = b.slice(pre, m - suf);
    var out = [], i;
    for (i = 0; i < pre; i++) out.push({ t: 0, ai: i, bi: i });

    var r = myers(A, B, eq, limit);
    if (r.degraded && flags) flags.degraded = true;
    var mid = r.ops;
    for (i = 0; i < mid.length; i++) {
      var o = mid[i];
      if (o.t === 0) out.push({ t: 0, ai: o.ai + pre, bi: o.bi + pre });
      else if (o.t === 1) out.push({ t: 1, ai: o.ai + pre });
      else out.push({ t: 2, bi: o.bi + pre });
    }
    for (i = 0; i < suf; i++) out.push({ t: 0, ai: n - suf + i, bi: m - suf + i });
    return out;
  }

  /* 行相似度：公共前缀 + 公共后缀占比 */
  function similarity(s1, s2) {
    if (!s1 && !s2) return 1;
    if (!s1 || !s2) return 0;
    var t1 = s1.trim(), t2 = s2.trim();
    if (t1 === t2) return 1;
    var a = t1.length, b = t2.length;
    if (!a || !b) return 0;
    var n = Math.min(a, b), p = 0, q = 0;
    while (p < n && t1.charCodeAt(p) === t2.charCodeAt(p)) p++;
    while (q < n - p && t1.charCodeAt(a - 1 - q) === t2.charCodeAt(b - 1 - q)) q++;
    return (p + q) / Math.max(a, b);
  }

  var SIM_THRESHOLD = 0.35;

  /* 把一个「连续非 eq」的变更块折成成对行。
     配对策略：**逐对独立判定**，没有任何块级/前缀式的整体决策——
     某对相似度不达标就地拆成「删 + 增」，绝不因为邻居合格而被强配成 mod，
     也不会因为前一对不合格而使后面合格的对照样被埋没（块内断崖）。
     输出顺序按 diff 工具惯例：连续不合格段内部是「删块 + 增块」，不逐对交替；
     合格对（mod）作为分隔。dels[k]/inss[k] 各自严格递增，
     所以无论怎么分段，左右两列的行号在各自列内都严格递增。 */
  function buildRows(ops, aLines, bLines, degraded) {
    var rows = [], i = 0, k;
    while (i < ops.length) {
      if (ops[i].t === 0) { rows.push({ type: 'eq', a: ops[i].ai, b: ops[i].bi }); i++; continue; }

      var dels = [], inss = [];
      while (i < ops.length && ops[i].t !== 0) {
        if (ops[i].t === 1) dels.push(ops[i].ai);
        else inss.push(ops[i].bi);
        i++;
      }

      var limit = Math.min(dels.length, inss.length);
      var single = (dels.length === 1 && inss.length === 1);

      // 待刷缓冲：先攒够一段连续不合格对，再一次性「先全部 del、再全部 ins」
      var pendDel = [], pendIns = [];
      var flushPending = function () {
        var p;
        for (p = 0; p < pendDel.length; p++) rows.push({ type: 'del', a: pendDel[p], b: null });
        for (p = 0; p < pendIns.length; p++) rows.push({ type: 'ins', a: null, b: pendIns[p] });
        pendDel.length = 0;
        pendIns.length = 0;
      };

      for (k = 0; k < limit; k++) {
        var s = similarity(aLines[dels[k]], bLines[inss[k]]);
        // 单行对单行：门槛放到 0.1（否则两条无关的等长文本永远拆不开）；
        // 多行块内仍用 SIM_THRESHOLD，避免把「整块重写」误判成一串修改。
        // 注：!degraded 在此处实际不可达——降级要求编辑距离 >1200，而单对单块距离恒为 2；
        // 保留它只是防止未来改上限后出现「降级 + 强配」叠加、把错误藏得更深。
        var pass = (single && !degraded) ? (s >= 0.1) : (s >= SIM_THRESHOLD);
        if (pass) {
          flushPending();                                   // 合格对是分隔点，先把积压的删/增刷出去
          rows.push({ type: 'mod', a: dels[k], b: inss[k] });
        } else {
          pendDel.push(dels[k]);
          pendIns.push(inss[k]);
        }
      }
      // 尾部补齐（左右行数不等时超出的那些行）也必须进缓冲，最后统一「先删后增」刷出。
      // 否则剩余的 del 会落到已刷出的 ins 之后，把插入块夹在删除块中间（窄化版锯齿）。
      for (k = limit; k < dels.length; k++) pendDel.push(dels[k]);
      for (k = limit; k < inss.length; k++) pendIns.push(inss[k]);
      flushPending();
    }
    return rows;
  }

  /* 把 rows 里连续的非 eq 行归为一个差异块，供「上一处/下一处」跳转使用。
     a/b 为首个左侧/右侧行号（可能为 null）；aAt/bAt 为跳转落点（纯增行时取插入位置）。 */
  function collectBlocks(rows) {
    var blocks = [], cur = null, nextA = 0, nextB = 0, i, r;
    for (i = 0; i < rows.length; i++) {
      r = rows[i];
      if (r.type === 'eq') { cur = null; nextA = r.a + 1; nextB = r.b + 1; continue; }
      if (!cur) {
        cur = {
          a: r.a, b: r.b,
          aAt: (r.a != null ? r.a : nextA),
          bAt: (r.b != null ? r.b : nextB)
        };
        blocks.push(cur);
      }
      r.blk = blocks.length - 1;
      if (r.a != null) nextA = r.a + 1;
      if (r.b != null) nextB = r.b + 1;
    }
    return blocks;
  }

  function charDiff(s1, s2) {
    var A = Array.from(s1), B = Array.from(s2);
    // 不传 flags：字符级超限只是「整行标红」，不算整体降级；
    // 层数上限单独收紧，避免一行几千字符撞 1200 层（约 72 万次内层循环）。
    var ops = diffCore(A, B, function (x, y) { return x === y; }, null, CHAR_DIFF_LIMIT_OPS);
    var L = [], R = [], i;
    function push(arr, t, ch) {
      var last = arr[arr.length - 1];
      if (last && last.t === t) last.text += ch;
      else arr.push({ t: t, text: ch });
    }
    for (i = 0; i < ops.length; i++) {
      var o = ops[i];
      if (o.t === 0) { push(L, 0, A[o.ai]); push(R, 0, B[o.bi]); }
      else if (o.t === 1) push(L, 1, A[o.ai]);
      else push(R, 2, B[o.bi]);
    }
    return { L: L, R: R };
  }

  function splitLines(text) {
    if (!text) return [];
    // 统一在这里剥掉首个 BOM：文件解码路径和手工粘贴/拖入都会经过这里，
    // 不剥会让首行「看起来一样却被判为修改」。
    var t = text.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
    var lines = t.split('\n');
    if (lines.length && lines[lines.length - 1] === '') lines.pop();
    return lines;
  }

  /* 空白归一化带缓存：myers 内层会按 O(D²) 次调用 eq，
     每次都 replace+trim 会把主线程拖死；SQL 里重复行极多，缓存命中率很高。 */
  function makeEq(ignoreWs) {
    if (!ignoreWs) return function (x, y) { return x === y; };
    var cache = new Map();
    function norm(s) {
      var v = cache.get(s);
      if (v === undefined) {
        if (cache.size > 200000) cache.clear();
        v = s.replace(/[ \t\u00a0\u3000\uFEFF]+/g, ' ').trim();
        cache.set(s, v);
      }
      return v;
    }
    return function (x, y) {
      if (x === y) return true;
      return norm(x) === norm(y);
    };
  }

  /* =========================================================
   * 2. 分析：一次 diff，左右各得一份「行状态 + 字符级片段」
   * =======================================================*/
  function analyze() {
    var aLines = splitLines(taL.value);
    var bLines = splitLines(taR.value);
    var eq = makeEq($('optWs').checked);

    var res = {
      aLines: aLines, bLines: bLines, rows: [], blocks: [],
      leftStatus: {}, rightStatus: {},
      leftSegs: {}, rightSegs: {},
      add: 0, del: 0, mod: 0, same: 0,
      degraded: false
    };

    if (aLines.length === 0 && bLines.length === 0) return res;

    var flags = { degraded: false };
    var ops = diffCore(aLines, bLines, eq, flags);
    var rows = buildRows(ops, aLines, bLines, flags.degraded);
    res.rows = rows;
    res.degraded = !!flags.degraded;
    res.blocks = collectBlocks(rows);

    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (r.type === 'eq') { res.same++; continue; }
      if (r.type === 'del') { res.del++; res.leftStatus[r.a] = 'del'; continue; }
      if (r.type === 'ins') { res.add++; res.rightStatus[r.b] = 'ins'; continue; }

      res.mod++;
      res.leftStatus[r.a] = 'mod';
      res.rightStatus[r.b] = 'mod';
      var s1 = aLines[r.a], s2 = bLines[r.b];
      if (s1.length + s2.length > CHAR_DIFF_LIMIT) continue;
      var cd = charDiff(s1, s2);
      res.leftSegs[r.a] = cd.L;
      res.rightSegs[r.b] = cd.R;
    }
    return res;
  }

  /* =========================================================
   * 3. 编辑区原地高亮（行号列 + 行背景 + 字符级色块）
   * =======================================================*/
  var gutterCache = { L: null, R: null };
  var lastLnw = '';

  function renderGutter(side, count, status) {
    var host = side === 'L' ? $('gutL') : $('gutR');
    var cache = gutterCache[side];

    if (!cache || cache.count !== count) {
      var frag = document.createDocumentFragment();
      for (var i = 0; i < count; i++) {
        var d = document.createElement('div');
        d.className = 'gn';
        d.style.top = (PAD_T + i * LH) + 'px';
        d.textContent = String(i + 1);
        frag.appendChild(d);
      }
      host.textContent = '';
      host.appendChild(frag);
      cache = gutterCache[side] = { count: count, nodes: Array.prototype.slice.call(host.childNodes) };
    }

    var nodes = cache.nodes;
    for (var j = 0; j < nodes.length; j++) {
      var st = status[j];
      var cls = 'gn';
      // 修改行：左侧红、右侧绿，但额外挂 mod 类，让 ::before 显示 ~ 而不是 −/+
      if (st === 'mod') cls += (side === 'L' ? ' del mod' : ' ins mod');
      else if (st === 'del') cls += ' del';
      else if (st === 'ins') cls += ' ins';
      if (nodes[j].className !== cls) nodes[j].className = cls;
    }
  }

  function renderBg(side, status) {
    var host = side === 'L' ? $('bgL') : $('bgR');
    var frag = document.createDocumentFragment();
    for (var k in status) {
      if (!Object.prototype.hasOwnProperty.call(status, k)) continue;
      // 与 renderGutter 的行号映射保持一致：修改行左侧用 del 样式、右侧用 ins 样式
      var st = status[k];
      var cls = (st === 'mod') ? (side === 'L' ? 'del' : 'ins') : st;
      var d = document.createElement('div');
      d.className = 'hl-line ' + cls;
      d.style.top = (PAD_T + Number(k) * LH) + 'px';
      frag.appendChild(d);
    }
    host.textContent = '';
    host.appendChild(frag);
  }

  // 字符级色块：渲染整行影子文本，只让差异片段显色（正常文字由 textarea 显示）
  function renderChars(side, segs) {
    var host = side === 'L' ? $('chL') : $('chR');
    var frag = document.createDocumentFragment();
    for (var k in segs) {
      if (!Object.prototype.hasOwnProperty.call(segs, k)) continue;
      var lineEl = document.createElement('div');
      lineEl.className = 'hline';
      lineEl.style.top = (Number(k) * LH) + 'px';
      var parts = segs[k];
      for (var i = 0; i < parts.length; i++) {
        var s = parts[i];
        var sp = document.createElement('span');
        sp.className = (s.t === 0) ? 'c' : (side === 'L' ? 'w-del' : 'w-ins');
        sp.textContent = s.text;
        lineEl.appendChild(sp);
      }
      frag.appendChild(lineEl);
    }
    host.textContent = '';
    host.appendChild(frag);
  }

  function syncScroll(side) {
    var ta = side === 'L' ? taL : taR;
    // 高 DPI / 平滑滚动下 scrollLeft/scrollTop 可能是小数，
    // 与 textarea 原生滚动的取整方式不一致会导致字符高亮 ±1px 抖动
    var sy = Math.round(ta.scrollTop), sx = Math.round(ta.scrollLeft);
    var gut = side === 'L' ? $('gutL') : $('gutR');
    var bg = side === 'L' ? $('bgL') : $('bgR');
    var ch = side === 'L' ? $('chL') : $('chR');
    gut.style.transform = 'translateY(' + (-sy) + 'px)';
    bg.style.transform = 'translateY(' + (-sy) + 'px)';
    ch.style.transform = 'translate(' + (-sx) + 'px,' + (-sy) + 'px)';
  }

  function renderSide(side, res) {
    var lines = side === 'L' ? res.aLines : res.bLines;
    var status = side === 'L' ? res.leftStatus : res.rightStatus;
    var segs = side === 'L' ? res.leftSegs : res.rightSegs;

    // 宽度与 CSS 里的 --signw / --gutgap / --gutpad 同源，不再用试凑出来的魔法数
    var maxLn = Math.max(res.aLines.length, res.bLines.length, 1);
    var digits = Math.max(3, String(maxLn).length);
    var lnw = 'calc(var(--signw) + var(--gutgap) + var(--gutpad) + ' + digits + 'ch)';
    if (lnw !== lastLnw) {
      lastLnw = lnw;
      document.documentElement.style.setProperty('--lnw', lnw);
    }

    renderGutter(side, lines.length, status);
    renderBg(side, status);
    renderChars(side, segs);
    syncScroll(side);
  }

  var curBlock = -1;

  function updateStats(res) {
    $('pAdd').textContent = '+' + res.add;
    $('pDel').textContent = '−' + res.del;
    $('pMod').textContent = '~' + res.mod;
    $('pSame').textContent = '=' + res.same;
    $('statInline').title = res.add + ' 行新增 / ' + res.del + ' 行删除 / ' + res.mod + ' 行修改 / ' +
      res.same + ' 行未变 · 左 ' + res.aLines.length + ' 行 / 右 ' + res.bLines.length + ' 行';

    // 降级必须显式告知：此时的行对应关系是猜的，不能让用户以为是正常结果
    var warn = $('pWarn');
    if (res.degraded) {
      warn.hidden = false;
      warn.title = '差异规模超出计算上限（编辑距离 > 1200），已退化为「整块删除 + 整块新增」再按相似度配对，' +
        '行对应关系可能不准。建议：勾选「忽略空白」重试，或按函数/段落拆开分别对比。';
    } else {
      warn.hidden = true;
      warn.title = '';
    }

    var n = res.blocks ? res.blocks.length : 0;
    if (curBlock >= n) curBlock = n - 1;
    $('navPrev').disabled = (n === 0);
    $('navNext').disabled = (n === 0);
    $('navPos').textContent = (curBlock < 0 ? 0 : curBlock + 1) + '/' + n;
    $('navPos').title = n ? ('共 ' + n + ' 处差异 · Alt+↑ / Alt+↓ 跳转') : '没有差异';
  }

  /* 滚到某个 textarea 的第 idx 行并居中 */
  function centerLine(ta, idx) {
    if (idx == null) return;
    var max = Math.max(0, ta.scrollHeight - ta.clientHeight);
    var target = PAD_T + idx * LH - ta.clientHeight / 2 + LH / 2;
    ta.scrollTop = Math.max(0, Math.min(max, target));
  }

  /* 在详细面板里滚到某一行元素（view 未设 position，offsetTop 相对 .detail，故需减去 view.offsetTop） */
  function scrollDetailTo(el) {
    var view = $('diffView');
    if (!el) return;
    var top = el.offsetTop - view.offsetTop;
    view.scrollTop = Math.max(0, top - view.clientHeight / 2 + el.offsetHeight / 2);
  }

  /* dir: 1 下一处 / -1 上一处 */
  function gotoBlock(dir) {
    var res = lastRes;
    var n = (res && res.blocks) ? res.blocks.length : 0;
    if (!n) return;
    if (curBlock < 0) curBlock = (dir > 0) ? 0 : n - 1;
    else curBlock = ((curBlock + dir) % n + n) % n;

    var blk = res.blocks[curBlock];
    if (!$('detail').hidden) {
      scrollDetailTo($('diffView').querySelector('[data-block="' + curBlock + '"]'));
    } else {
      centerLine(taL, blk.aAt);
      centerLine(taR, blk.bAt);
      syncScroll('L');
      syncScroll('R');
    }
    $('navPos').textContent = (curBlock + 1) + '/' + n;
  }

  var lastRes = null, lastCost = 0, timer = null;

  function refresh() {
    // 详细面板是全屏覆盖层：打开时下层的三层高亮完全被遮挡，重算纯属浪费
    if (!$('detail').hidden) return lastRes;

    var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
    var res = analyze();
    lastRes = res;
    renderSide('L', res);
    renderSide('R', res);
    updateStats(res);
    $('cntL').textContent = res.aLines.length + ' 行';
    $('cntR').textContent = res.bLines.length + ' 行';
    var t1 = (window.performance && performance.now) ? performance.now() : Date.now();
    lastCost = Math.max(1, Math.round(t1 - t0));
    return res;
  }

  function scheduleRefresh() {
    clearTimeout(timer);
    timer = setTimeout(refresh, 160);
  }

  /* =========================================================
   * 4. 详细对比面板（并排 + 折叠）
   * =======================================================*/
  function foldEqRows(rows, ctx) {
    var out = [], i = 0;
    while (i < rows.length) {
      if (rows[i].type !== 'eq') { out.push(rows[i]); i++; continue; }
      var j = i;
      while (j < rows.length && rows[j].type === 'eq') j++;
      var len = j - i;
      if (len > ctx * 2 + 1) {
        var k;
        for (k = i; k < i + ctx; k++) out.push(rows[k]);
        out.push({ type: 'fold', count: len - ctx * 2, rows: rows.slice(i + ctx, j - ctx) });
        for (k = j - ctx; k < j; k++) out.push(rows[k]);
      } else {
        for (var k2 = i; k2 < j; k2++) out.push(rows[k2]);
      }
      i = j;
    }
    return out;
  }

  function renderDetail(res) {
    var view = $('diffView');
    if (!res) return;
    var aLines = res.aLines, bLines = res.bLines;

    // .ln 的内边距是 4+8，与主编辑区的 --lnw 不是同一套算法，这里单独算
    var digits = Math.max(3, String(Math.max(aLines.length, bLines.length, 1)).length);
    view.style.setProperty('--lnw', 'calc(12px + ' + digits + 'ch)');

    function makeCell(side, idx, lines, segs) {
      var cell = document.createElement('div');
      cell.className = 'cell ' + side;
      var ln = document.createElement('span');
      ln.className = 'ln';
      var tx = document.createElement('span');
      tx.className = 'tx';
      if (idx == null) {
        cell.classList.add('empty');
      } else {
        ln.textContent = String(idx + 1);
        if (segs) {
          for (var i = 0; i < segs.length; i++) {
            var s = segs[i];
            if (s.t === 0) tx.appendChild(document.createTextNode(s.text));
            else {
              var sp = document.createElement('span');
              sp.className = (side === 'left' ? 'w-del-mark' : 'w-ins-mark');
              sp.textContent = s.text;
              tx.appendChild(sp);
            }
          }
        } else {
          tx.textContent = lines[idx];
        }
      }
      cell.appendChild(ln);
      cell.appendChild(tx);
      return cell;
    }

    function build(r) {
      if (r.type === 'fold') {
        var box = document.createElement('div');
        box.className = 'fold';
        var btn = document.createElement('button');
        btn.textContent = '展开 ' + r.count + ' 行未变更';
        btn.addEventListener('click', function () {
          var frag = document.createDocumentFragment();
          for (var i = 0; i < r.rows.length; i++) frag.appendChild(build(r.rows[i]));
          box.parentNode.insertBefore(frag, box);
          box.remove();
        });
        box.appendChild(btn);
        return box;
      }
      var row = document.createElement('div');
      row.className = 'row ' + r.type;
      if (r.blk != null) row.setAttribute('data-block', String(r.blk));
      var segL = (r.type === 'mod') ? res.leftSegs[r.a] : null;
      var segR = (r.type === 'mod') ? res.rightSegs[r.b] : null;
      row.appendChild(makeCell('left', r.a, aLines, segL));
      row.appendChild(makeCell('right', r.b, bLines, segR));
      return row;
    }

    var display = $('optFold').checked ? foldEqRows(res.rows, FOLD_CTX) : res.rows;

    if (!display.length) {
      view.innerHTML = '<div class="placeholder">两侧都还没有内容，或者内容完全一致。</div>';
    } else {
      var frag = document.createDocumentFragment();
      for (var i = 0; i < display.length; i++) frag.appendChild(build(display[i]));
      view.textContent = '';
      view.appendChild(frag);
    }

    $('detailMeta').textContent = '+' + res.add + ' −' + res.del + ' ~' + res.mod +
      ' · 左 ' + aLines.length + ' 行 / 右 ' + bLines.length + ' 行 · ' + lastCost + 'ms' +
      (res.degraded ? ' · ⚠ 已降级对齐，行对应仅供参考' : '');
  }

  function openDetail() {
    clearTimeout(timer);
    var res = refresh();
    // 面板是全屏覆盖层，但焦点可能还留在 textarea 上：
    // 不锁住的话用户继续打字会写进看不见的输入框，关闭后统计/高亮全是旧值。
    taL.readOnly = true;
    taR.readOnly = true;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    $('detail').hidden = false;
    renderDetail(res);
    var view = $('diffView');
    var n = (res && res.blocks) ? res.blocks.length : 0;
    if (!n) { view.scrollTop = 0; return; }
    if (curBlock < 0) curBlock = 0;
    var el = view.querySelector('[data-block="' + curBlock + '"]');
    // 首屏定位到差异处顶部（不居中，保留上方上下文）
    if (el) view.scrollTop = Math.max(0, el.offsetTop - view.offsetTop - 32);
    $('navPos').textContent = (curBlock + 1) + '/' + n;
  }

  function closeDetail() {
    var wasOpen = !$('detail').hidden;
    $('detail').hidden = true;
    taL.readOnly = false;
    taR.readOnly = false;
    // refresh() 在面板打开期间是短路返回的，这里必须补算一次，
    // 否则关闭瞬间的统计/行数/三层高亮还是打开前的旧值。
    if (wasOpen) refresh();
  }

  $('btnDetail').addEventListener('click', openDetail);
  $('btnCloseDetail').addEventListener('click', closeDetail);
  $('optFold').addEventListener('change', function () {
    renderDetail(lastRes || refresh());
  });
  $('navPrev').addEventListener('click', function () { gotoBlock(-1); });
  $('navNext').addEventListener('click', function () { gotoBlock(1); });

  /* =========================================================
   * 5. 交互
   * =======================================================*/
  [taL, taR].forEach(function (ta) {
    var side = (ta === taL) ? 'L' : 'R';

    ta.addEventListener('input', scheduleRefresh);
    ta.addEventListener('paste', function () { setTimeout(scheduleRefresh, 0); });
    ta.addEventListener('cut', function () { setTimeout(scheduleRefresh, 0); });
    ta.addEventListener('scroll', function () { syncScroll(side); });

    ta.addEventListener('keydown', function (e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        document.execCommand('insertText', false, '    ');
        scheduleRefresh();
      }
    });

    ta.addEventListener('dragover', function (e) { e.preventDefault(); ta.classList.add('drag'); });
    ta.addEventListener('dragleave', function () { ta.classList.remove('drag'); });
    ta.addEventListener('drop', function (e) {
      e.preventDefault();
      ta.classList.remove('drag');
      if (e.dataTransfer.files && e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0], ta);
    });
  });

  /* =========================================================
   * 4.5 文件解码：UTF-8 / GBK 自动识别
   * =======================================================*/
  var rawBuf = { L: null, R: null };     // 原始 ArrayBuffer，供手动切换编码时复用
  var encMode = { L: 'auto', R: 'auto' };
  var lastDecoded = { L: '', R: '' };    // 上次解码产出的文本，用于识别「是否被手工改过」

  function tryDecode(bytes, label, fatal) {
    try {
      return new TextDecoder(label, fatal ? { fatal: true } : undefined).decode(bytes);
    } catch (e) {
      return null;   // 非法字节序列，或该环境不支持此编码标签
    }
  }

  /* 解码 + 清洗：剥 BOM、去 NUL。BOM 不剥会让首行「看起来一样却被判为修改」。 */
  function decodeBuffer(buf, mode) {
    var text = null;
    if (typeof TextDecoder === 'undefined') {
      // 极端老环境兜底：按 UTF-8 近似处理
      text = String.fromCharCode.apply(null, new Uint8Array(buf));
    } else {
      var bytes = new Uint8Array(buf);
      // 严格 UTF-8 解得通 = 基本可以确定就是 UTF-8。
      // 手选 GBK 时也优先采信它，避免把 UTF-8 中文解成「涓枃娴嬭瘯」这类乱码且毫无提示。
      var strict = tryDecode(bytes, 'utf-8', true);
      if (mode === 'gbk') {
        text = (strict != null && strict.indexOf('\uFFFD') < 0) ? strict : tryDecode(bytes, 'gbk', false);
      } else if (mode === 'utf-8') {
        text = (strict != null) ? strict : tryDecode(bytes, 'utf-8', false);
      } else {
        text = strict;
        if (text == null) text = tryDecode(bytes, 'gbk', false);
        if (text == null) text = tryDecode(bytes, 'utf-8', false);
      }
    }
    if (text == null) text = '';
    return text.replace(/^\uFEFF/, '').replace(/\u0000/g, '');
  }

  /* 把原始字节解码后写入该侧。
     force=true（载入新文件）跳过「丢弃手工修改」确认；nextMode 为本次要切换到的编码。
     返回 false 表示用户在确认框里取消了。 */
  function applyBuffer(side, force, nextMode) {
    var ta = side === 'L' ? taL : taR;
    var buf = rawBuf[side];
    if (!buf) { if (nextMode != null) encMode[side] = nextMode; return true; }
    // 先确认、后落状态：否则用户取消后 encMode 已经被改掉，下拉框回退不回去
    if (!force && ta.value !== lastDecoded[side]) {
      if (!window.confirm('切换编码会丢弃该侧的手工修改，继续？')) return false;
    }
    if (nextMode != null) encMode[side] = nextMode;
    ta.value = decodeBuffer(buf, encMode[side]);
    lastDecoded[side] = ta.value;
    ta.scrollTop = 0;
    ta.scrollLeft = 0;
    curBlock = -1;              // 内容整体换掉了，导航位置复位
    refresh();
    return true;
  }

  function loadFile(file, ta) {
    var side = (ta === taL) ? 'L' : 'R';
    if (file.size > 20 * 1024 * 1024) alert('文件超过 20MB，加载可能较慢，请稍候。');
    var reader = new FileReader();
    reader.onload = function () {
      rawBuf[side] = reader.result;
      // 手动选定的编码只对当前这份内容有效：换文件一律回到「自动」，
      // 否则上一份手选的 GBK 会让这份 UTF-8 文件静默变成乱码。
      encMode[side] = 'auto';
      (side === 'L' ? $('encL') : $('encR')).value = 'auto';
      applyBuffer(side, true);
    };
    reader.onerror = function () { alert('文件读取失败：' + file.name); };
    reader.readAsArrayBuffer(file);
  }

  $('encL').addEventListener('change', function (e) {
    if (!applyBuffer('L', false, e.target.value)) e.target.value = encMode.L;
  });
  $('encR').addEventListener('change', function (e) {
    if (!applyBuffer('R', false, e.target.value)) e.target.value = encMode.R;
  });

  $('fileL').addEventListener('change', function (e) {
    if (e.target.files[0]) loadFile(e.target.files[0], taL);
    e.target.value = '';
  });
  $('fileR').addEventListener('change', function (e) {
    if (e.target.files[0]) loadFile(e.target.files[0], taR);
    e.target.value = '';
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-clear]'), function (btn) {
    btn.addEventListener('click', function () {
      var side = btn.getAttribute('data-clear');
      var ta = side === 'L' ? taL : taR;
      ta.value = '';
      ta.scrollTop = 0;
      ta.scrollLeft = 0;
      rawBuf[side] = null;      // 清掉原始字节，避免切编码时文本又冒回来
      lastDecoded[side] = '';
      curBlock = -1;
      refresh();
      ta.focus();
    });
  });

  $('btnSwap').addEventListener('click', function () {
    var tmp = taL.value; taL.value = taR.value; taR.value = tmp;
    var tb = rawBuf.L; rawBuf.L = rawBuf.R; rawBuf.R = tb;
    var tm = encMode.L; encMode.L = encMode.R; encMode.R = tm;
    var td = lastDecoded.L; lastDecoded.L = lastDecoded.R; lastDecoded.R = td;
    $('encL').value = encMode.L;
    $('encR').value = encMode.R;
    taL.scrollTop = 0; taR.scrollTop = 0;
    taL.scrollLeft = 0; taR.scrollLeft = 0;
    curBlock = -1;
    refresh();
  });

  $('btnClear').addEventListener('click', function () {
    taL.value = ''; taR.value = '';
    rawBuf.L = null; rawBuf.R = null;
    curBlock = -1;
    refresh();
    taL.focus();
  });

  $('btnTheme').addEventListener('click', function () {
    var root = document.documentElement;
    var dark = root.getAttribute('data-theme') === 'dark';
    root.setAttribute('data-theme', dark ? 'light' : 'dark');
    $('btnTheme').textContent = dark ? '深色' : '浅色';
  });

  $('optWs').addEventListener('change', scheduleRefresh);

  document.addEventListener('keydown', function (e) {
    if (e.altKey && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      e.preventDefault();
      gotoBlock(e.key === 'ArrowDown' ? 1 : -1);
      return;
    }
    if (e.key === 'Escape' && !$('detail').hidden) { closeDetail(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); openDetail(); }
  });

  $('btnSample').addEventListener('click', function () {
    taL.value =
      'function getUserList(page, size) {\n' +
      '  const offset = page * size;\n' +
      '  const sql = "SELECT id, name, email FROM users LIMIT ? OFFSET ?";\n' +
      '  return db.query(sql, [size, offset]);\n' +
      '}\n' +
      '\n' +
      '// 查询用户总数\n' +
      'function countUsers() {\n' +
      '  return db.query("SELECT COUNT(*) FROM users");\n' +
      '}\n' +
      '\n' +
      'module.exports = { getUserList, countUsers };';
    taR.value =
      'function getUserList(page, size) {\n' +
      '  const offset = (page - 1) * size;\n' +
      '  const sql = "SELECT id, name, email, status FROM users WHERE deleted_at IS NULL LIMIT ? OFFSET ?";\n' +
      '  return db.query(sql, [size, offset]);\n' +
      '}\n' +
      '\n' +
      '// 查询用户总数（仅统计未删除用户）\n' +
      'function countUsers() {\n' +
      '  return db.query("SELECT COUNT(*) FROM users WHERE deleted_at IS NULL");\n' +
      '}\n' +
      '\n' +
      'function softDeleteUser(id) {\n' +
      '  return db.query("UPDATE users SET deleted_at = NOW() WHERE id = ?", [id]);\n' +
      '}\n' +
      '\n' +
      'module.exports = { getUserList, countUsers, softDeleteUser };';
    taL.scrollTop = 0; taR.scrollTop = 0;
    taL.scrollLeft = 0; taR.scrollLeft = 0;
    curBlock = -1;
    refresh();
  });

  refresh();
})();
</script>
</body>
</html>
