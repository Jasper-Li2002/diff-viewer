<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工时填报机 · 多项目 · 内部工具箱</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='%230F6E56'%20stroke-width='2'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Crect%20x='3'%20y='5'%20width='18'%20height='16'%20rx='3'/%3E%3Cpath%20d='M3%2010h18M8%203v4M16%203v4'/%3E%3Cpath%20d='M7.5%2014h4M7.5%2017h7'/%3E%3C/svg%3E">
<style>
:root{
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", Roboto, sans-serif;
  --bg:#f5f6f8; --panel:#ffffff; --line:#e3e6ea; --line-soft:#eef0f3;
  --text:#1f2328; --muted:#6b7280; --faint:#9aa1a8;
  --accent:#0f6e56; --accent-ink:#ffffff; --accent-soft:#e8f6ef;
  --train-bg:#f7f8fa; --train-line:#e3e6ea; --train-ink:#3d4450; --train-tag:#8a9099;
  --hol-bg:#f1f2f4; --hol-line:#e9ebee; --hol-ink:#9aa1a8;
  --rest-bg:#f7f7f8; --rest-line:#f0f1f3; --rest-ink:#b6bbc2;
  --warn:#9a5b00; --warn-bg:#fdf4e5; --warn-line:#f0dcb8;
  --mask:rgba(15,23,32,.34);
}
html[data-theme="dark"]{
  --bg:#0d1117; --panel:#161b22; --line:#30363d; --line-soft:#222932;
  --text:#e6edf3; --muted:#8b949e; --faint:#6e7681;
  --accent:#2ea884; --accent-ink:#04140f; --accent-soft:#123326;
  --train-bg:#1a2029; --train-line:#2a323d; --train-ink:#c3ccd6; --train-tag:#8b949e;
  --hol-bg:#1c222b; --hol-line:#262d36; --hol-ink:#8b949e;
  --rest-bg:#12171e; --rest-line:#1b222a; --rest-ink:#5c6672;
  --warn:#e3b341; --warn-bg:#2b2213; --warn-line:#4a3a1c;
  --mask:rgba(1,4,9,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.app-head{display:flex;align-items:center;gap:10px;padding:11px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
body.embedded .app-head{display:none}
.app-head .logo{width:24px;height:24px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.app-head .brand{font-weight:500}
.app-head .back{margin-left:auto;font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.layout{display:grid;grid-template-columns:214px minmax(0,1fr);gap:16px;padding:16px 20px 26px;max-width:1220px;margin:0 auto;align-items:start}
@media (max-width:900px){ .layout{grid-template-columns:1fr;padding:12px} .side{position:static!important} }
.side{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;position:sticky;top:14px}
.fld{display:block;font-size:11px;color:var(--muted);margin:0 0 4px}
.control{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 8px;font-size:13px;outline:none}
.control:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.mrow{display:flex;gap:6px;align-items:center}
.arrow{width:28px;height:30px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:7px;background:var(--panel);cursor:pointer;color:var(--muted)}
.arrow:hover{background:var(--line-soft)}
.hint{font-size:11px;color:var(--faint);margin:5px 0 0;line-height:1.5}
.btn{width:100%;border:1px solid transparent;border-radius:7px;padding:7px 0;font-size:12.5px;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-weight:500}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--panel);border-color:var(--line);color:var(--text);font-weight:400}
.btn.ghost:hover{background:var(--line-soft)}
.btn+.btn{margin-top:6px}
.sec{border-top:1px solid var(--line-soft);margin-top:12px;padding-top:11px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sec-h span{font-size:11px;color:var(--muted)}
.sec-h button{border:0;background:transparent;color:var(--accent);font-size:11px;cursor:pointer;padding:0}
.prow{display:grid;grid-template-columns:10px minmax(0,1fr) 46px 18px;gap:5px;align-items:center;margin-bottom:5px}
.dot{width:9px;height:9px;border-radius:3px}
.prow input{border:1px solid transparent;background:transparent;border-radius:5px;padding:3px 4px;font-size:12.5px;min-width:0;width:100%}
.prow input:hover{border-color:var(--line)}
.prow input:focus{border-color:var(--accent);background:var(--panel);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.prow input.num{text-align:right;font-variant-numeric:tabular-nums}
.prow button{border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:14px;line-height:1;padding:2px}
.prow button:hover{color:#c0392b}
.srow{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:var(--muted)}
.srow b{font-weight:500;color:var(--text);font-variant-numeric:tabular-nums}
.srow b.ok{color:var(--accent)}
.srow b.bad{color:var(--warn)}
.bar{height:4px;border-radius:99px;background:var(--line-soft);overflow:hidden;margin:8px 0 2px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .18s ease}
.bar.over i{background:var(--warn)}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.stage-top{display:flex;align-items:baseline;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.stage-top h1{font-size:15px;font-weight:500;margin:0}
.stage-top .sub{font-size:12px;color:var(--muted)}
.stage-top .sp{flex:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow{font-size:11px;color:var(--faint);text-align:center;padding:0 0 4px}
.day{position:relative;text-align:left;border:1px solid transparent;border-radius:9px;min-height:64px;padding:6px 7px 9px;background:var(--panel);cursor:pointer;display:flex;flex-direction:column;gap:1px;transition:box-shadow .12s;overflow:hidden}
.day:hover{box-shadow:inset 0 0 0 2px var(--accent-soft)}
.day .dn{font-size:13.5px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.day .dt{font-size:10.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .strip{position:absolute;left:0;right:0;bottom:0;height:4px;display:flex}
.day .strip i{display:block;height:100%}
.day.is-train{background:var(--train-bg);border-color:var(--train-line)}
.day.is-train .dn{color:var(--train-ink)}
.day.is-train .dt{color:var(--train-tag)}
.day.is-hol{background:var(--hol-bg);border-color:var(--hol-line)}
.day.is-hol .dn,.day.is-hol .dt{color:var(--hol-ink)}
.day.is-rest{background:var(--rest-bg);border-color:var(--rest-line)}
.day.is-rest .dn{color:var(--rest-ink)}
.day.is-makeup{border-style:dashed}
.day.is-today{box-shadow:inset 0 0 0 2px var(--accent)}
.day.is-out{background:transparent;border-color:transparent;cursor:default;opacity:.3}
.day.is-out:hover{box-shadow:none}
.stage-foot{display:flex;align-items:center;gap:14px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line-soft);flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.warnbox{display:none;margin-top:10px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.55}
.warnbox.on{display:block}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:30}
.modal.on{display:flex}
.modal .mask{position:absolute;inset:0;background:var(--mask)}
.sheet{position:relative;width:min(420px,calc(100vw - 32px));background:var(--panel);border-radius:14px;border:1px solid var(--line);padding:16px 16px 14px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.sheet-h{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.sheet-h b{font-size:14px;font-weight:500}
.sheet-h .sum{margin-left:auto;font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.sheet-h .sum.ok{color:var(--accent)}
.sheet-h .sum.bad{color:var(--warn)}
.erow{display:grid;grid-template-columns:minmax(0,1fr) 58px 16px 18px;gap:6px;align-items:center;margin-bottom:6px}
.erow select,.erow input{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 6px;font-size:12.5px;min-width:0;outline:none}
.erow select:focus,.erow input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.erow input{text-align:right;font-variant-numeric:tabular-nums}
.erow .u{font-size:11px;color:var(--faint)}
.erow button{border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:15px;line-height:1;padding:2px}
.erow button:hover{color:#c0392b}
.sheet-f{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft)}
.sheet-f .btn{width:auto;padding:6px 14px}
.sheet-f .sp{flex:1}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);background:var(--text);color:var(--panel);font-size:12.5px;padding:7px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:40}
.toast.on{opacity:.94;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header class="app-head">
  <span class="logo"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/></svg></span>
  <span class="brand">工时填报机</span>
  <span style="font-size:12px;color:var(--muted)">多项目 · 按月分配</span>
  <a class="back" href="toolbox.html">返回工具箱</a>
</header>

<div class="layout">
  <aside class="side">
    <label class="fld" for="monthInput">月份</label>
    <div class="mrow">
      <button class="arrow" id="btnPrev" type="button" title="上一月" aria-label="上一月">&#8249;</button>
      <input class="control" id="monthInput" type="month" value="2026-10" style="text-align:center">
      <button class="arrow" id="btnNext" type="button" title="下一月" aria-label="下一月">&#8250;</button>
    </div>

    <div class="sec">
      <div class="sec-h">
        <span>项目与定额</span>
        <button type="button" id="btnAddProj">+ 添加</button>
      </div>
      <div id="projList"></div>
      <div class="hint" id="projHint">合计 80h = 10 天</div>
    </div>

    <div class="sec">
      <label class="lg" style="cursor:pointer;margin-bottom:8px;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)"><input type="checkbox" id="optMakeup" style="margin:0"> 调休上班日参与分配</label>
      <button class="btn" id="btnAuto" type="button">自动分配</button>
      <button class="btn ghost" id="btnReset" type="button">清除手动调整</button>
    </div>

    <div class="sec">
      <div class="srow"><span>项目合计</span><b id="stTarget">80h · 10 天</b></div>
      <div class="srow"><span>已排入</span><b id="stAlloc">80h</b></div>
      <div class="srow"><span>差额</span><b id="stGap" class="ok">0h</b></div>
      <div class="bar" id="bar"><i id="barFill"></i></div>
      <div class="srow"><span>Training</span><b id="stTrain">0 天</b></div>
      <div class="srow" id="rowMakeup" style="display:none"><span>其中调休上班</span><b id="stMakeup">0 天</b></div>
      <div class="srow"><span>Vacation</span><b id="stVac">0 天</b></div>
    </div>

    <div class="sec">
      <button class="btn ghost" id="btnCsv" type="button">导出 CSV（一天多行）</button>
      <button class="btn ghost" id="btnCopy" type="button">复制为文本</button>
      <button class="btn ghost" id="btnTheme" type="button">切换深色</button>
    </div>
  </aside>

  <main class="stage">
    <div class="stage-top">
      <h1 id="stageTitle">2026 年 10 月</h1>
      <span class="sub" id="stageSub">17 个可分配工作日</span>
      <span class="sp"></span>
      <span class="sub">点击日期编辑 · Shift+点击改日期类型</span>
    </div>
    <div class="cal" id="cal"></div>
    <div class="warnbox" id="warn"></div>
    <div class="stage-foot">
      <span id="footNote">按项目定额连续排布，整日填满后自动转入下一个项目。</span>
      <span style="margin-left:auto" id="footSource">节假日数据：国务院办公厅 2025-11-04 通知</span>
    </div>
  </main>
</div>

<div class="modal" id="modal">
  <div class="mask" data-close="1"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="sheet-h"><b id="mTitle">10 月 8 日</b><span class="sum" id="mSum">8h / 8h</span></div>
    <div id="mRows"></div>
    <div class="sheet-f">
      <button class="btn ghost" type="button" id="mAdd">+ 一行</button>
      <button class="btn ghost" type="button" id="mClear">清空</button>
      <span class="sp"></span>
      <button class="btn ghost" type="button" id="mCancel">取消</button>
      <button class="btn" type="button" id="mOk">确定</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  if (window.self !== window.top) document.body.classList.add('embedded');

  /* =========================================================
   * 1. 节假日数据（国务院办公厅 2025-11-04 通知）
   * =======================================================*/
  var HOLIDAY_RANGES = [
    ['2026-01-01', '2026-01-03'],
    ['2026-02-15', '2026-02-23'],
    ['2026-04-04', '2026-04-06'],
    ['2026-05-01', '2026-05-05'],
    ['2026-06-19', '2026-06-21'],
    ['2026-09-25', '2026-09-27'],
    ['2026-10-01', '2026-10-07']
  ];
  var MAKEUP_DAYS = ['2026-01-04', '2026-02-14', '2026-02-28', '2026-05-09', '2026-09-20', '2026-10-10'];
  var HOLIDAY_SET = Object.create(null);
  var MAKEUP_SET = Object.create(null);
  var KNOWN_YEARS = { 2026: true };

  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function keyOf(dt) { return dt.getFullYear() + '-' + pad2(dt.getMonth() + 1) + '-' + pad2(dt.getDate()); }
  function parseKey(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }

  (function () {
    var i, d, end;
    for (i = 0; i < HOLIDAY_RANGES.length; i++) {
      d = parseKey(HOLIDAY_RANGES[i][0]);
      end = parseKey(HOLIDAY_RANGES[i][1]);
      while (d <= end) { HOLIDAY_SET[keyOf(d)] = true; d.setDate(d.getDate() + 1); }
    }
    for (i = 0; i < MAKEUP_DAYS.length; i++) MAKEUP_SET[MAKEUP_DAYS[i]] = true;
  })();

  /* =========================================================
   * 2. 状态
   * =======================================================*/
  var STORE_KEY = 'workbuddy.timesheet.v2';
  var OLD_KEY = 'workbuddy.timesheet.v1';
  var PALETTE = ['#0f6e56', '#185fa5', '#9a5b00', '#7a3fa0', '#a32d2d', '#3b6d11', '#0e7490', '#8a4b2a'];
  var TRAIN = '__training__';
  var VAC = '__vacation__';
  var TRAIN_LABEL = 'Training';
  var VAC_LABEL = 'Vacation';
  var MAX_H = 8;

  var state = {
    ym: '2026-10',
    projects: [
      { id: 'p1', name: '项目A', hours: 40 },
      { id: 'p2', name: '项目B', hours: 40 }
    ],
    includeMakeup: false,
    overrides: Object.create(null),
    kindOverrides: Object.create(null),
    theme: 'light'
  };

  function colorOf(pid) {
    var i;
    for (i = 0; i < state.projects.length; i++) if (state.projects[i].id === pid) return PALETTE[i % PALETTE.length];
    return PALETTE[0];
  }
  function projectOf(pid) {
    var i;
    for (i = 0; i < state.projects.length; i++) if (state.projects[i].id === pid) return state.projects[i];
    return null;
  }
  function labelOf(pid) {
    if (pid === TRAIN) return TRAIN_LABEL;
    if (pid === VAC) return VAC_LABEL;
    var p = projectOf(pid);
    return p ? p.name : pid;
  }
  function totalProjectHours() {
    var s = 0, i;
    for (i = 0; i < state.projects.length; i++) s += (state.projects[i].hours || 0);
    return s;
  }
  function newId() {
    return 'p' + Date.now().toString(36) + Math.floor(Math.random() * 1000).toString(36);
  }

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        ym: state.ym, projects: state.projects, includeMakeup: state.includeMakeup,
        overrides: state.overrides, kindOverrides: state.kindOverrides, theme: state.theme
      }));
    } catch (e) { }
  }

  function load() {
    var raw = null, obj = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch (e) { }
    if (raw) {
      try { obj = JSON.parse(raw); } catch (e) { obj = null; }
    }
    if (!obj) {
      /* 从单项目版本迁移 */
      try { raw = localStorage.getItem(OLD_KEY); } catch (e) { raw = null; }
      if (raw) {
        try {
          var old = JSON.parse(raw);
          if (old && typeof old.hours === 'number') {
            state.ym = old.ym || state.ym;
            state.projects = [{ id: 'p1', name: 'Project', hours: old.hours }];
            state.includeMakeup = !!old.includeMakeup;
            state.theme = old.theme === 'dark' ? 'dark' : 'light';
          }
        } catch (e2) { }
      }
      return;
    }
    if (typeof obj.ym === 'string' && /^\d{4}-\d{2}$/.test(obj.ym)) state.ym = obj.ym;
    if (Array.isArray(obj.projects) && obj.projects.length) {
      state.projects = obj.projects.filter(function (p) { return p && p.id; }).map(function (p) {
        return { id: String(p.id), name: String(p.name || '未命名'), hours: Math.max(0, Math.round(+p.hours || 0)) };
      });
    }
    state.includeMakeup = !!obj.includeMakeup;
    if (obj.overrides && typeof obj.overrides === 'object') state.overrides = obj.overrides;
    if (obj.kindOverrides && typeof obj.kindOverrides === 'object') state.kindOverrides = obj.kindOverrides;
    if (obj.theme === 'dark') state.theme = 'dark';
  }

  /* =========================================================
   * 3. 日期
   * =======================================================*/
  var WEEK_CN = ['一', '二', '三', '四', '五', '六', '日'];
  function splitYM(ym) { var p = ym.split('-'); return { y: +p[0], m: +p[1] }; }

  function kindOf(dt) {
    var k = keyOf(dt);
    if (state.kindOverrides[k]) return state.kindOverrides[k];
    if (HOLIDAY_SET[k]) return 'holiday';
    if (MAKEUP_SET[k]) return 'makeup';
    var w = dt.getDay();
    return (w === 0 || w === 6) ? 'weekend' : 'workday';
  }

  function buildMonth(ym) {
    var p = splitYM(ym), y = p.y, m = p.m;
    var first = new Date(y, m - 1, 1);
    var offset = (first.getDay() + 6) % 7;
    var total = new Date(y, m, 0).getDate();
    var cells = [], i, d, dt;

    for (i = 0; i < offset; i++) {
      dt = new Date(y, m - 1, 1 - (offset - i));
      cells.push({ out: true, dt: dt, key: keyOf(dt), day: dt.getDate(), kind: null, week: 0 });
    }
    for (d = 1; d <= total; d++) {
      dt = new Date(y, m - 1, d);
      cells.push({ out: false, dt: dt, key: keyOf(dt), day: d, kind: kindOf(dt), week: Math.floor((offset + d - 1) / 7) });
    }
    while (cells.length % 7 !== 0) {
      dt = new Date(y, m - 1, total + (cells.length - offset - total) + 1);
      cells.push({ out: true, dt: dt, key: keyOf(dt), day: dt.getDate(), kind: null, week: 0 });
    }
    return cells;
  }

  /* =========================================================
   * 4. 分配：按项目定额连续铺排，日容量 8h
   * =======================================================*/
  function buildPlan(cells, projects, includeMakeup) {
    var plan = Object.create(null);
    var pool = [], i, c;

    for (i = 0; i < cells.length; i++) {
      c = cells[i];
      if (c.out) continue;
      if (c.kind === 'holiday') plan[c.key] = { kind: 'vacation', slots: [] };
      else if (c.kind === 'weekend') plan[c.key] = { kind: 'rest', slots: [] };
      else plan[c.key] = { kind: 'training', slots: [] };
      if (c.kind === 'workday' || (c.kind === 'makeup' && includeMakeup)) pool.push(c);
    }

    var cap = [], warn = [];
    for (i = 0; i < pool.length; i++) cap.push(MAX_H);

    var capacity = pool.length * MAX_H;
    var demand = 0;
    for (i = 0; i < projects.length; i++) demand += Math.max(0, projects[i].hours || 0);
    if (demand > capacity) {
      warn.push('项目定额合计 ' + demand + 'h 超过本月容量 ' + capacity + 'h（' + pool.length + ' 个工作日）。');
    }

    var ptr = 0, k, rem, take;
    for (k = 0; k < projects.length; k++) {
      rem = Math.max(0, projects[k].hours || 0);
      while (rem > 0 && ptr < pool.length) {
        if (cap[ptr] <= 0) { ptr++; continue; }
        take = Math.min(rem, cap[ptr]);
        plan[pool[ptr].key].slots.push({ id: projects[k].id, h: take });
        cap[ptr] -= take;
        rem -= take;
        if (cap[ptr] === 0) ptr++;
      }
      if (rem > 0) warn.push('「' + projects[k].name + '」剩余 ' + rem + 'h 未能排入。');
    }

    /* 日剩余补 Training；整天未用的工作日也标 Training */
    for (i = 0; i < pool.length; i++) {
      var key = pool[i].key;
      var used = 0, j;
      for (j = 0; j < plan[key].slots.length; j++) used += plan[key].slots[j].h;
      if (used < MAX_H) plan[key].slots.push({ id: TRAIN, h: MAX_H - used });
      plan[key].kind = plan[key].slots[0].id === TRAIN ? 'training' : 'work';
    }

    /* 未参与分配的调休上班日：整日 Training，但显示「调休」 */
    for (i = 0; i < cells.length; i++) {
      c = cells[i];
      if (c.out || c.kind !== 'makeup') continue;
      if (plan[c.key] && plan[c.key].slots.length === 0) {
        plan[c.key].slots.push({ id: TRAIN, h: MAX_H });
        plan[c.key].kind = 'training';
      }
    }

    return { plan: plan, warn: warn, poolSize: pool.length, capacity: capacity };
  }

  /* =========================================================
   * 5. 渲染
   * =======================================================*/
  var el = {};
  ['cal', 'monthInput', 'projList', 'projHint', 'optMakeup', 'stageTitle', 'stageSub',
    'stTarget', 'stAlloc', 'stGap', 'stTrain', 'stVac', 'bar', 'barFill', 'warn',
    'footSource', 'btnTheme', 'toast', 'modal', 'mTitle', 'mSum', 'mRows'].forEach(function (id) {
      el[id] = document.getElementById(id);
    });

  var current = null;

  function fmtDays(h) {
    var d = h / 8;
    return Math.abs(d - Math.round(d)) < 1e-9 ? String(Math.round(d)) : d.toFixed(1);
  }

  function escAttr(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  function tint(hex, alpha) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }

  function renderProjects() {
    var html = [], i;
    for (i = 0; i < state.projects.length; i++) {
      var p = state.projects[i];
      html.push(
        '<div class="prow" data-id="' + p.id + '">' +
          '<span class="dot" style="background:' + PALETTE[i % PALETTE.length] + '"></span>' +
          '<input class="pname" value="' + escAttr(p.name) + '" maxlength="16" aria-label="项目名称">' +
          '<input class="num phours" type="number" min="0" max="400" step="1" value="' + p.hours + '" aria-label="项目工时">' +
          '<button type="button" class="pdel" title="删除">×</button>' +
        '</div>');
    }
    el.projList.innerHTML = html.join('');
    el.projHint.textContent = '合计 ' + totalProjectHours() + 'h = ' + fmtDays(totalProjectHours()) + ' 天';
  }

  function render() {
    var p = splitYM(state.ym), y = p.y, m = p.m;
    var cells = buildMonth(state.ym);
    var built = buildPlan(cells, state.projects, state.includeMakeup);
    var plan = built.plan;
    var i, j, kk, c;

    /* 手动覆盖 */
    for (kk in state.overrides) {
      if (!Object.prototype.hasOwnProperty.call(state.overrides, kk)) continue;
      if (!plan[kk]) continue;
      var ov = state.overrides[kk];
      if (!Array.isArray(ov)) continue;
      plan[kk] = { kind: 'work', slots: ov.map(function (s) { return { id: s.id, h: s.h }; }) };
      recomputeKind(plan[kk]);
    }

    current = { cells: cells, plan: plan, built: built };

    var frag = [];
    for (i = 0; i < 7; i++) frag.push('<div class="dow">' + WEEK_CN[i] + '</div>');

    var todayKey = keyOf(new Date());
    var sumProject = 0, trainDays = 0, vacDays = 0, makeupDays = 0;

    for (i = 0; i < cells.length; i++) {
      c = cells[i];
      if (c.out) {
        frag.push('<div class="day is-out"><span class="dn">' + c.day + '</span></div>');
        continue;
      }
      var a = plan[c.key] || { kind: 'training', slots: [] };
      var cls = 'day', label = '', strip = '', titleParts = [], hasProject = false;
      var used = 0;

      for (j = 0; j < a.slots.length; j++) {
        if (a.slots[j].id !== TRAIN && a.slots[j].id !== VAC) hasProject = true;
        titleParts.push(labelOf(a.slots[j].id) + ' ' + a.slots[j].h + 'h');
      }

      if (a.kind === 'rest') {
        cls += ' is-rest';
      } else if (a.kind === 'vacation') {
        cls += ' is-hol'; label = VAC_LABEL; vacDays++;
      } else if (!hasProject) {
        cls += ' is-train';
        if (c.kind === 'makeup') { label = '调休'; makeupDays++; } else { label = TRAIN_LABEL; }
        trainDays++;
      } else {
        var dom = null, domH = -1;
        for (j = 0; j < a.slots.length; j++) {
          var s = a.slots[j];
          if (s.id === TRAIN || s.id === VAC) continue;
          used += s.h;
          if (s.h > domH) { domH = s.h; dom = s; }
        }
        var dcol = dom ? colorOf(dom.id) : '#0f6e56';
        cls += ' is-work';
        var style = 'background:' + tint(dcol, 0.12) + ';border-color:' + tint(dcol, 0.42) + ';';
        var names = [];
        for (j = 0; j < a.slots.length; j++) {
          var sl = a.slots[j];
          if (sl.id === TRAIN || sl.id === VAC) continue;
          names.push(labelOf(sl.id));
        }
        label = names.length === 1 ? names[0] : (names[0] + ' +' + (names.length - 1));
        if (label.length > 6) label = label.slice(0, 6);
        for (j = 0; j < a.slots.length; j++) {
          var sg = a.slots[j];
          var col = (sg.id === TRAIN || sg.id === VAC) ? '#c9ced6' : colorOf(sg.id);
          strip += '<i style="width:' + (sg.h / MAX_H * 100) + '%;background:' + col + '"></i>';
        }
        sumProject += used;
        if (c.kind === 'makeup') cls += ' is-makeup';
        if (c.key === todayKey) cls += ' is-today';
        frag.push('<button type="button" class="' + cls + '" data-key="' + c.key + '" style="' + style + '" title="' + escAttr(titleParts.join(' / ')) + '">' +
          '<span class="dn">' + c.day + '</span><span class="dt">' + escAttr(label) + '</span>' +
          '<span class="strip">' + strip + '</span></button>');
        continue;
      }

      if (c.kind === 'makeup') cls += ' is-makeup';
      if (c.key === todayKey) cls += ' is-today';
      var tt = titleParts.length ? titleParts.join(' / ') : '';
      frag.push('<button type="button" class="' + cls + '" data-key="' + c.key + '"' + (tt ? ' title="' + escAttr(tt) + '"' : '') + '>' +
        '<span class="dn">' + c.day + '</span>' + (label ? '<span class="dt">' + label + '</span>' : '') +
        '</button>');
    }

    el.cal.innerHTML = frag.join('');

    var target = totalProjectHours();
    el.stageTitle.textContent = y + ' 年 ' + m + ' 月';
    el.stageSub.textContent = built.poolSize + ' 个可分配工作日 · 容量 ' + built.capacity + 'h';
    el.stTarget.textContent = target + 'h · ' + fmtDays(target) + ' 天';
    el.stAlloc.textContent = sumProject + 'h';
    var gap = target - sumProject;
    el.stGap.textContent = gap === 0 ? '0h' : (gap > 0 ? '缺 ' + gap + 'h' : '超 ' + (-gap) + 'h');
    el.stGap.className = gap === 0 ? 'ok' : 'bad';
    el.stTrain.textContent = trainDays + ' 天';
    el.stVac.textContent = vacDays + ' 天';
    document.getElementById('rowMakeup').style.display = makeupDays ? '' : 'none';
    document.getElementById('stMakeup').textContent = makeupDays + ' 天';
    el.barFill.style.width = (target > 0 ? Math.min(100, sumProject / target * 100) : 0) + '%';
    el.bar.className = 'bar' + (sumProject > target ? ' over' : '');

    var warnList = built.warn.slice();
    if (gap !== 0 && !warnList.length) {
      warnList.push(gap > 0 ? ('还有 ' + gap + 'h 未排入，可点击日期手动补。') : ('已超排 ' + (-gap) + 'h。'));
    }
    if (!KNOWN_YEARS[y]) warnList.push(y + ' 年节假日数据未内置，当前仅按周末计算；Shift+点击日期可标记为节假日。');
    if (warnList.length) { el.warn.className = 'warnbox on'; el.warn.textContent = warnList.join(' '); }
    else { el.warn.className = 'warnbox'; el.warn.textContent = ''; }

    el.footSource.textContent = KNOWN_YEARS[y] ? '节假日数据：国务院办公厅 2025-11-04 通知' : '节假日数据：未内置 ' + y + ' 年';
  }

  function recomputeKind(entry) {
    var has = false, i;
    for (i = 0; i < entry.slots.length; i++) {
      if (entry.slots[i].id !== TRAIN && entry.slots[i].id !== VAC) { has = true; break; }
    }
    entry.kind = has ? 'work' : (entry.slots.length && entry.slots[0].id === VAC ? 'vacation' : 'training');
  }

  /* =========================================================
   * 6. 项目清单交互
   * =======================================================*/
  el.projList.addEventListener('input', function (e) {
    var row = e.target.closest('.prow');
    if (!row) return;
    var proj = projectOf(row.getAttribute('data-id'));
    if (!proj) return;
    if (e.target.classList.contains('pname')) {
      proj.name = e.target.value || '未命名';
      save();
      return;
    }
    if (e.target.classList.contains('phours')) {
      var v = parseFloat(e.target.value);
      proj.hours = isFinite(v) && v > 0 ? Math.round(v) : 0;
      el.projHint.textContent = '合计 ' + totalProjectHours() + 'h = ' + fmtDays(totalProjectHours()) + ' 天';
      state.overrides = Object.create(null);
      save(); render();
    }
  });

  el.projList.addEventListener('blur', function (e) {
    if (!e.target.classList || !e.target.classList.contains('pname')) return;
    if (!e.target.value) { e.target.value = '未命名'; }
    renderProjects(); render();
  }, true);

  el.projList.addEventListener('click', function (e) {
    if (!e.target.classList.contains('pdel')) return;
    var row = e.target.closest('.prow');
    var id = row.getAttribute('data-id');
    if (state.projects.length <= 1) { toast('至少保留一个项目'); return; }
    state.projects = state.projects.filter(function (p) { return p.id !== id; });
    state.overrides = Object.create(null);
    save(); renderProjects(); render();
  });

  document.getElementById('btnAddProj').addEventListener('click', function () {
    state.projects.push({ id: newId(), name: '项目' + String.fromCharCode(65 + state.projects.length), hours: 0 });
    state.overrides = Object.create(null);
    save(); renderProjects(); render();
  });

  /* =========================================================
   * 7. 单日编辑
   * =======================================================*/
  var editing = null;

  function renderEditorRows() {
    var html = [], i;
    var opts = [];
    for (i = 0; i < state.projects.length; i++) {
      opts.push('<option value="' + state.projects[i].id + '">' + escAttr(state.projects[i].name) + '</option>');
    }
    opts.push('<option value="' + TRAIN + '">' + TRAIN_LABEL + '</option>');
    opts.push('<option value="' + VAC + '">' + VAC_LABEL + '</option>');
    var base = opts.join('');

    for (i = 0; i < editing.slots.length; i++) {
      var s = editing.slots[i];
      var sel = base.replace('value="' + s.id + '"', 'value="' + s.id + '" selected');
      html.push('<div class="erow" data-i="' + i + '"><select>' + sel + '</select>' +
        '<input type="number" min="0" max="8" step="1" value="' + s.h + '"><span class="u">h</span>' +
        '<button type="button" class="rm" title="删除">×</button></div>');
    }
    el.mRows.innerHTML = html.join('');
    updateEditorSum();
  }

  function updateEditorSum() {
    var sum = 0, i;
    for (i = 0; i < editing.slots.length; i++) sum += editing.slots[i].h;
    el.mSum.textContent = sum + 'h / ' + MAX_H + 'h';
    el.mSum.className = 'sum' + (sum === MAX_H ? ' ok' : ' bad');
  }

  function openEditor(key) {
    var entry = current.plan[key];
    if (!entry) return;
    editing = { key: key, slots: entry.slots.map(function (s) { return { id: s.id, h: s.h }; }) };
    if (!editing.slots.length) {
      editing.slots.push({ id: state.projects[0] ? state.projects[0].id : TRAIN, h: MAX_H });
    }
    var c = null, i;
    for (i = 0; i < current.cells.length; i++) if (current.cells[i].key === key) { c = current.cells[i]; break; }
    el.mTitle.textContent = splitYM(state.ym).m + ' 月 ' + (c ? c.day : '') + ' 日 · 周' + WEEK_CN[(c.dt.getDay() + 6) % 7];
    renderEditorRows();
    el.modal.classList.add('on');
  }

  function closeEditor() {
    el.modal.classList.remove('on');
    editing = null;
  }

  el.mRows.addEventListener('input', function (e) {
    var row = e.target.closest('.erow');
    if (!row) return;
    var i = +row.getAttribute('data-i');
    if (e.target.tagName === 'SELECT') editing.slots[i].id = e.target.value;
    else {
      var v = parseInt(e.target.value, 10);
      editing.slots[i].h = isFinite(v) ? Math.max(0, Math.min(MAX_H, v)) : 0;
    }
    updateEditorSum();
  });

  el.mRows.addEventListener('click', function (e) {
    if (!e.target.classList.contains('rm')) return;
    var i = +e.target.closest('.erow').getAttribute('data-i');
    editing.slots.splice(i, 1);
    if (!editing.slots.length) editing.slots.push({ id: state.projects[0] ? state.projects[0].id : TRAIN, h: 0 });
    renderEditorRows();
  });

  document.getElementById('mAdd').addEventListener('click', function () {
    var used = 0, i;
    for (i = 0; i < editing.slots.length; i++) used += editing.slots[i].h;
    editing.slots.push({ id: state.projects[0] ? state.projects[0].id : TRAIN, h: Math.max(0, MAX_H - used) });
    renderEditorRows();
  });

  document.getElementById('mClear').addEventListener('click', function () {
    editing.slots = [{ id: TRAIN, h: MAX_H }];
    renderEditorRows();
  });

  document.getElementById('mCancel').addEventListener('click', closeEditor);
  el.modal.addEventListener('click', function (e) {
    if (e.target.getAttribute && e.target.getAttribute('data-close')) closeEditor();
  });

  document.getElementById('mOk').addEventListener('click', function () {
    if (!editing) return;
    var slots = editing.slots.filter(function (s) { return s.h > 0; });
    var sum = 0, i;
    for (i = 0; i < slots.length; i++) sum += slots[i].h;
    if (sum > MAX_H) { toast('当日合计不能超过 ' + MAX_H + 'h'); return; }
    state.overrides[editing.key] = slots;
    save();
    closeEditor();
    render();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && el.modal.classList.contains('on')) closeEditor();
  });

  /* =========================================================
   * 8. 日历交互
   * =======================================================*/
  el.cal.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.day') : null;
    if (!btn || !btn.dataset || !btn.dataset.key) return;
    if (btn.classList.contains('is-out')) return;
    var key = btn.dataset.key;

    if (e.shiftKey) {
      var cell = null, i;
      for (i = 0; i < current.cells.length; i++) if (current.cells[i].key === key) { cell = current.cells[i]; break; }
      if (!cell) return;
      var kind = kindOf(cell.dt);
      state.kindOverrides[key] = (kind === 'holiday' || kind === 'weekend') ? 'workday' : 'holiday';
      delete state.overrides[key];
      save(); render();
      toast('已标记为' + (state.kindOverrides[key] === 'holiday' ? '节假日' : '工作日'));
      return;
    }
    openEditor(key);
  });

  /* =========================================================
   * 9. 其他控件
   * =======================================================*/
  document.getElementById('btnPrev').addEventListener('click', function () { shiftMonth(-1); });
  document.getElementById('btnNext').addEventListener('click', function () { shiftMonth(1); });

  function shiftMonth(delta) {
    var p = splitYM(state.ym), d = new Date(p.y, p.m - 1 + delta, 1);
    state.ym = d.getFullYear() + '-' + pad2(d.getMonth() + 1);
    state.overrides = Object.create(null);
    el.monthInput.value = state.ym;
    save(); render();
  }

  el.monthInput.addEventListener('change', function () {
    var v = el.monthInput.value;
    if (!/^\d{4}-\d{2}$/.test(v)) return;
    state.ym = v;
    state.overrides = Object.create(null);
    save(); render();
  });

  el.optMakeup.addEventListener('change', function () {
    state.includeMakeup = el.optMakeup.checked;
    state.overrides = Object.create(null);
    save(); render();
  });

  document.getElementById('btnAuto').addEventListener('click', function () {
    state.overrides = Object.create(null);
    save(); render();
    toast('已按项目定额重新排布');
  });

  document.getElementById('btnReset').addEventListener('click', function () {
    state.overrides = Object.create(null);
    state.kindOverrides = Object.create(null);
    save(); render();
    toast('已清除所有手动调整');
  });

  /* =========================================================
   * 10. 导出（一天多行）
   * =======================================================*/
  function exportRows() {
    var rows = [], i, j, c, a;
    for (i = 0; i < current.cells.length; i++) {
      c = current.cells[i];
      if (c.out) continue;
      a = current.plan[c.key];
      if (!a || !a.slots.length) continue;
      for (j = 0; j < a.slots.length; j++) {
        if (a.slots[j].h <= 0) continue;
        rows.push([c.key, '周' + WEEK_CN[(c.dt.getDay() + 6) % 7], labelOf(a.slots[j].id), a.slots[j].h]);
      }
    }
    return rows;
  }

  function download(name, text) {
    var blob = new Blob(['\ufeff' + text], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 500);
  }

  document.getElementById('btnCsv').addEventListener('click', function () {
    var rows = exportRows();
    var lines = ['日期,星期,项目,工时'];
    var i;
    for (i = 0; i < rows.length; i++) lines.push(rows[i].join(','));
    download('timesheet-' + state.ym + '.csv', lines.join('\r\n'));
    toast('已导出 ' + rows.length + ' 行');
  });

  document.getElementById('btnCopy').addEventListener('click', function () {
    var rows = exportRows();
    var lines = [], i;
    for (i = 0; i < rows.length; i++) lines.push(rows[i].join('\t'));
    var text = lines.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('已复制 ' + rows.length + ' 行'); },
        function () { toast('复制失败，请改用导出 CSV'); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('已复制'); } catch (e) { toast('复制失败'); }
      ta.remove();
    }
  });

  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.className = 'toast on';
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.toast.className = 'toast'; }, 1600);
  }

  function applyTheme() {
    document.documentElement.setAttribute('data-theme', state.theme);
    el.btnTheme.textContent = state.theme === 'dark' ? '切换浅色' : '切换深色';
  }
  el.btnTheme.addEventListener('click', function () {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    applyTheme(); save();
  });

  /* =========================================================
   * 11. 启动
   * =======================================================*/
  load();
  el.monthInput.value = state.ym;
  el.optMakeup.checked = state.includeMakeup;
  applyTheme();
  renderProjects();
  render();

  window.__timesheet = {
    state: state, buildPlan: buildPlan, buildMonth: buildMonth, render: render,
    exportRows: exportRows, openEditor: openEditor, closeEditor: closeEditor
  };
})();
</script>
</body>
</html>
