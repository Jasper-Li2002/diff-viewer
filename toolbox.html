<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>内部工具箱 · 工时填报机 / 文本对比工具</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='%230C447C'%20stroke-width='2.2'%3E%3Crect%20x='3'%20y='3'%20width='7'%20height='7'%20rx='1.6'/%3E%3Crect%20x='14'%20y='3'%20width='7'%20height='7'%20rx='1.6'/%3E%3Crect%20x='3'%20y='14'%20width='7'%20height='7'%20rx='1.6'/%3E%3Crect%20x='14'%20y='14'%20width='7'%20height='7'%20rx='1.6'/%3E%3C/svg%3E">
<style>
:root{
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", Roboto, sans-serif;
  --bg:#f5f6f8; --panel:#ffffff; --line:#e3e6ea; --line-soft:#eef0f3;
  --text:#1f2328; --muted:#6b7280; --faint:#9aa1a8;
  --brand:#0c447c;
  --teal-bg:#e8f6ef; --teal-ink:#0f6e56;
  --blue-bg:#e6f1fb; --blue-ink:#185fa5;
}
html[data-theme="dark"]{
  --bg:#0d1117; --panel:#161b22; --line:#30363d; --line-soft:#222932;
  --text:#e6edf3; --muted:#8b949e; --faint:#6e7681;
  --teal-bg:#123326; --teal-ink:#7fdda0;
  --blue-bg:#10243b; --blue-ink:#85b7eb;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:14px;padding:9px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px;white-space:nowrap}
.logo{width:24px;height:24px;border-radius:7px;background:var(--brand);display:flex;align-items:center;justify-content:center;flex:none}
.tabs{display:flex;align-items:center;gap:2px}
.tab{border:0;background:transparent;color:var(--muted);font-size:13px;padding:6px 13px;border-radius:7px;cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--line-soft);color:var(--text)}
.tab.on{background:var(--line-soft);color:var(--text);font-weight:500}
.sp{flex:1}
.ver{font-size:12px;color:var(--faint);white-space:nowrap}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
.view iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
.home{height:100%;overflow:auto;padding:30px 24px 40px}
.home-inner{max-width:840px;margin:0 auto}
.home h1{font-size:19px;font-weight:500;margin:0 0 6px}
.home p.lead{font-size:13px;color:var(--muted);margin:0 0 22px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){ .cards{grid-template-columns:1fr} .tab{padding:6px 9px;font-size:12px} .ver{display:none} }
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px;display:flex;flex-direction:column;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .14s,transform .14s}
.card:hover{border-color:var(--faint);transform:translateY(-1px)}
.card .ch{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.card h2{font-size:14.5px;font-weight:500;margin:0}
.card .sub{font-size:12px;color:var(--muted);margin-top:1px}
.card p{font-size:12.5px;line-height:1.62;color:var(--muted);margin:0}
.tags{display:flex;gap:6px;margin-top:13px;flex-wrap:wrap}
.tag{font-size:11px;color:var(--muted);background:var(--line-soft);border-radius:5px;padding:2px 7px}
.note{margin-top:20px;font-size:12px;color:var(--faint);line-height:1.7}
.note code{font-family:ui-monospace,Consolas,monospace;background:var(--line-soft);border-radius:4px;padding:1px 5px}
.err{display:none;margin:24px;background:#fff2f0;border:1px solid #ffccc7;color:#a8071a;border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.6}
.err.on{display:block}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/></svg></span>
    <span>内部工具箱</span>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab on" data-tab="home" role="tab">首页</button>
    <button class="tab" data-tab="timesheet" role="tab">工时填报机</button>
    <button class="tab" data-tab="diff" role="tab">文本对比工具</button>
  </nav>
  <span class="sp"></span>
  <span class="ver" id="verLabel">单文件 · 离线可用</span>
</header>

<main>
  <section class="view on" id="view-home">
    <div class="home">
      <div class="home-inner">
        <h1>两个常用工具，都在本地跑</h1>
        <p class="lead">不联网、不上传，粘贴的文本和填的工时只留在本机浏览器里。整个工具箱就是一个文件，拷到哪里都能用。</p>
        <div class="cards">
          <button class="card" type="button" data-open="timesheet">
            <div class="ch">
              <span class="ico" style="background:var(--teal-bg)">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--teal-ink)" stroke-width="1.9"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8 14h3M8 17h6"/></svg>
              </span>
              <div>
                <h2>工时填报机</h2>
                <div class="sub">月度工时自动分配</div>
              </div>
            </div>
            <p>输入本月总工时，自动换算天数并按自然周铺到日历；剩余工作日标 Training，节假日标 Vacation。</p>
            <div class="tags"><span class="tag">日历视图</span><span class="tag">支持半天</span><span class="tag">CSV 导出</span></div>
          </button>

          <button class="card" type="button" data-open="diff">
            <div class="ch">
              <span class="ico" style="background:var(--blue-bg)">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--blue-ink)" stroke-width="1.9"><rect x="3" y="4" width="7.5" height="16" rx="1.5"/><rect x="13.5" y="4" width="7.5" height="16" rx="1.5"/><path d="M5.5 9h2.5M5.5 13h2.5M16 9h2.5"/></svg>
              </span>
              <div>
                <h2>文本对比工具</h2>
                <div class="sub">原地高亮行级差异</div>
              </div>
            </div>
            <p>左右两栏粘贴文本，差异直接显示在输入框里；并排详细视图严格对齐行号，支持 UTF-8 / GBK 文件。</p>
            <div class="tags"><span class="tag">行级 + 字符级</span><span class="tag">差异跳转</span><span class="tag">零依赖</span></div>
          </button>
        </div>
        <div class="note">
          两个工具各自独立运行，互不影响。快捷键 <code>Alt + 1/2/3</code> 切换标签。<br>
          本文件已内置全部代码，<strong>不需要同目录下的其他文件</strong>，可直接发给同事。
        </div>
      </div>
    </div>
  </section>

  <section class="view" id="view-timesheet"><iframe id="frTimesheet" title="工时填报机"></iframe></section>
  <section class="view" id="view-diff"><iframe id="frDiff" title="文本对比工具"></iframe></section>
  <div class="err" id="errBox"></div>
</main>

ize:11px;line-height:1.15;letter-spacing:-.1px}\n.day.is-work{background:var(--work-bg);border-color:var(--work-line)}\n.day.is-work .dn,.day.is-work .dt{color:var(--work-ink)}\n.day.is-half{background:var(--work-bg);border-color:var(--work-line);border-style:dashed}\n.day.is-half .dn,.day.is-half .dt{color:var(--work-ink)}\n.day.is-train{background:var(--train-bg);border-color:var(--train-line)}\n.day.is-train .dn{color:var(--train-ink)}\n.day.is-train .dt{color:var(--train-tag)}\n.day.is-hol{background:var(--hol-bg);border-color:var(--hol-line)}\n.day.is-hol .dn{color:var(--hol-ink)}\n.day.is-hol .dt{color:var(--hol-tag)}\n.day.is-rest{background:var(--rest-bg);border-color:var(--rest-line)}\n.day.is-rest .dn{color:var(--rest-ink)}\n.day.is-makeup{border-style:dashed;border-color:var(--faint)}\n.day.is-today{box-shadow:inset 0 0 0 2px var(--accent)}\n.day.is-out{background:transparent;border-color:transparent;cursor:default;opacity:.33}\n.day.is-out:hover{box-shadow:none}\n.day.is-out .dn{font-weight:400}\n.stage-foot{display:flex;align-items:center;gap:14px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line-soft);flex-wrap:wrap;font-size:11.5px;color:var(--muted)}\n.warnbox{display:none;margin-top:10px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.55}\n.warnbox.on{display:block}\n.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);background:var(--text);color:var(--panel);font-size:12.5px;padding:7px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:20}\n.toast.on{opacity:.94;transform:translateX(-50%) translateY(0)}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader class=\"app-head\">\n  \u003cspan class=\"logo\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\">\u003crect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.6\"/>\u003crect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.6\"/>\u003crect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.6\"/>\u003crect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.6\"/>\u003c/svg>\u003c/span>\n  \u003cspan class=\"brand\">工时填报机\u003c/span>\n  \u003cspan style=\"font-size:12px;color:var(--muted)\">月度工时自动分配\u003c/span>\n  \u003ca class=\"back\" href=\"index.html\">返回工具集\u003c/a>\n\u003c/header>\n\n\u003cdiv class=\"layout\">\n  \u003caside class=\"side\">\n    \u003clabel class=\"fld\" for=\"monthInput\">月份\u003c/label>\n    \u003cdiv class=\"mrow\">\n      \u003cbutton class=\"arrow\" id=\"btnPrev\" type=\"button\" title=\"上一月\" aria-label=\"上一月\">&#8249;\u003c/button>\n      \u003cinput class=\"control\" id=\"monthInput\" type=\"month\" value=\"2026-10\" style=\"text-align:center\">\n      \u003cbutton class=\"arrow\" id=\"btnNext\" type=\"button\" title=\"下一月\" aria-label=\"下一月\">&#8250;\u003c/button>\n    \u003c/div>\n\n    \u003clabel class=\"fld\" for=\"hoursInput\" style=\"margin-top:12px\">本月总工时\u003c/label>\n    \u003cdiv class=\"mrow\">\n      \u003cinput class=\"control\" id=\"hoursInput\" type=\"number\" min=\"0\" max=\"400\" step=\"4\" value=\"80\" style=\"text-align:center;font-weight:500\">\n      \u003cspan style=\"font-size:12px;color:var(--muted);flex:none\">h\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"hint\" id=\"dayHint\">折合 10 天（每日 8h）\u003c/div>\n\n    \u003clabel class=\"fld\" for=\"projInput\">项目名称\u003c/label>\n    \u003cinput class=\"control\" id=\"projInput\" type=\"text\" value=\"Project\" maxlength=\"24\">\n\n    \u003cdiv style=\"margin-top:11px\">\n      \u003clabel class=\"lg\" style=\"cursor:pointer;margin-bottom:8px\">\u003cinput type=\"checkbox\" id=\"optMakeup\" style=\"margin:0 0 0 1px\"> 调休上班日参与分配\u003c/label>\n      \u003cbutton class=\"btn\" id=\"btnAuto\" type=\"button\">自动分配\u003c/button>\n      \u003cbutton class=\"btn ghost\" id=\"btnReset\" type=\"button\">清除手动调整\u003c/button>\n    \u003c/div>\n\n    \u003cdiv class=\"stat\">\n      \u003cdiv class=\"srow\">\u003cspan>目标\u003c/span>\u003cb id=\"stTarget\">80h · 10 天\u003c/b>\u003c/div>\n      \u003cdiv class=\"srow\">\u003cspan>已分配\u003c/span>\u003cb id=\"stAlloc\">80h · 10 天\u003c/b>\u003c/div>\n      \u003cdiv class=\"srow\">\u003cspan>差额\u003c/span>\u003cb id=\"stGap\" class=\"ok\">0h\u003c/b>\u003c/div>\n      \u003cdiv class=\"bar\" id=\"bar\">\u003ci id=\"barFill\">\u003c/i>\u003c/div>\n      \u003cdiv class=\"srow\">\u003cspan>Training\u003c/span>\u003cb id=\"stTrain\">7 天\u003c/b>\u003c/div>\n      \u003cdiv class=\"srow\" id=\"rowMakeup\" style=\"display:none\">\u003cspan>其中调休上班\u003c/span>\u003cb id=\"stMakeup\">0 天\u003c/b>\u003c/div>\n      \u003cdiv class=\"srow\">\u003cspan>Vacation\u003c/span>\u003cb id=\"stVac\">7 天\u003c/b>\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"legend\">\n      \u003cdiv class=\"lg\">\u003cspan class=\"sw\" style=\"background:var(--work-bg);border-color:var(--work-line)\">\u003c/span>填报工时\u003c/div>\n      \u003cdiv class=\"lg\">\u003cspan class=\"sw\" style=\"background:var(--train-bg);border-color:var(--train-line)\">\u003c/span>Training\u003c/div>\n      \u003cdiv class=\"lg\">\u003cspan class=\"sw\" style=\"background:var(--hol-bg);border-color:var(--hol-line)\">\u003c/span>Vacation\u003c/div>\n      \u003cdiv class=\"lg\">\u003cspan class=\"sw\" style=\"background:transparent;border:1px dashed var(--faint)\">\u003c/span>调休上班\u003c/div>\n    \u003c/div>\n\n    \u003cdiv style=\"border-top:1px solid var(--line-soft);margin-top:10px;padding-top:10px\">\n      \u003cbutton class=\"btn ghost\" id=\"btnCsv\" type=\"button\">导出 CSV\u003c/button>\n      \u003cbutton class=\"btn ghost\" id=\"btnCopy\" type=\"button\">复制为文本\u003c/button>\n      \u003cbutton class=\"btn ghost\" id=\"btnTheme\" type=\"button\">切换深色\u003c/button>\n    \u003c/div>\n  \u003c/aside>\n\n  \u003cmain class=\"stage\">\n    \u003cdiv class=\"stage-top\">\n      \u003ch1 id=\"stageTitle\">2026 年 10 月\u003c/h1>\n      \u003cspan class=\"sub\" id=\"stageSub\">17 个工作日 · 已分配 10 天\u003c/span>\n      \u003cspan class=\"sp\">\u003c/span>\n      \u003cspan class=\"sub\">点击日期切换 · Shift+点击改日期类型\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"cal\" id=\"cal\">\u003c/div>\n    \u003cdiv class=\"warnbox\" id=\"warn\">\u003c/div>\n    \u003cdiv class=\"stage-foot\">\n      \u003cspan id=\"footNote\">分配结果按自然周均分，周内从首个工作日连续填报。\u003c/span>\n      \u003cspan style=\"margin-left:auto\" id=\"footSource\">节假日数据：国务院办公厅 2025-11-04 通知\u003c/span>\n    \u003c/div>\n  \u003c/main>\n\u003c/div>\n\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\n\n\u003cscript>\n(function () {\n  'use strict';\n\n  if (window.self !== window.top) document.body.classList.add('embedded');\n\n  /* =========================================================\n   * 1. 节假日数据（国务院办公厅《关于2026年部分节假日安排的通知》）\n   * =======================================================*/\n  var HOLIDAY_RANGES = [\n    ['2026-01-01', '2026-01-03'],\n    ['2026-02-15', '2026-02-23'],\n    ['2026-04-04', '2026-04-06'],\n    ['2026-05-01', '2026-05-05'],\n    ['2026-06-19', '2026-06-21'],\n    ['2026-09-25', '2026-09-27'],\n    ['2026-10-01', '2026-10-07']\n  ];\n  var MAKEUP_DAYS = ['2026-01-04', '2026-02-14', '2026-02-28', '2026-05-09', '2026-09-20', '2026-10-10'];\n  var HOLIDAY_SET = Object.create(null);\n  var MAKEUP_SET = Object.create(null);\n  var KNOWN_YEARS = { 2026: true };\n\n  function pad2(n) { return (n \u003c 10 ? '0' : '') + n; }\n  function keyOf(dt) { return dt.getFullYear() + '-' + pad2(dt.getMonth() + 1) + '-' + pad2(dt.getDate()); }\n  function parseKey(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }\n\n  (function buildSets() {\n    var i, d, end;\n    for (i = 0; i \u003c HOLIDAY_RANGES.length; i++) {\n      d = parseKey(HOLIDAY_RANGES[i][0]);\n      end = parseKey(HOLIDAY_RANGES[i][1]);\n      while (d \u003c= end) { HOLIDAY_SET[keyOf(d)] = true; d.setDate(d.getDate() + 1); }\n    }\n    for (i = 0; i \u003c MAKEUP_DAYS.length; i++) MAKEUP_SET[MAKEUP_DAYS[i]] = true;\n  })();\n\n  /* =========================================================\n   * 2. 状态\n   * =======================================================*/\n  var STORE_KEY = 'workbuddy.timesheet.v1';\n  var state = {\n    ym: '2026-10',\n    hours: 80,\n    project: 'Project',\n    includeMakeup: false,\n    overrides: Object.create(null),\n    kindOverrides: Object.create(null),\n    theme: 'light'\n  };\n\n  function save() {\n    try {\n      localStorage.setItem(STORE_KEY, JSON.stringify({\n        ym: state.ym, hours: state.hours, project: state.project,\n        includeMakeup: state.includeMakeup, overrides: state.overrides,\n        kindOverrides: state.kindOverrides, theme: state.theme\n      }));\n    } catch (e) { /* 配额或隐私模式，忽略 */ }\n  }\n\n  function load() {\n    var raw, obj;\n    try { raw = localStorage.getItem(STORE_KEY); } catch (e) { return; }\n    if (!raw) return;\n    try { obj = JSON.parse(raw); } catch (e) { return; }\n    if (!obj || typeof obj !== 'object') return;\n    if (typeof obj.ym === 'string' && /^\\d{4}-\\d{2}$/.test(obj.ym)) state.ym = obj.ym;\n    if (typeof obj.hours === 'number' && isFinite(obj.hours)) state.hours = obj.hours;\n    if (typeof obj.project === 'string') state.project = obj.project;\n    state.includeMakeup = !!obj.includeMakeup;\n    if (obj.overrides && typeof obj.overrides === 'object') state.overrides = obj.overrides;\n    if (obj.kindOverrides && typeof obj.kindOverrides === 'object') state.kindOverrides = obj.kindOverrides;\n    if (obj.theme === 'dark') state.theme = 'dark';\n  }\n\n  /* =========================================================\n   * 3. 日期与星期\n   * =======================================================*/\n  var WEEK_CN = ['一', '二', '三', '四', '五', '六', '日'];\n\n  function splitYM(ym) { var p = ym.split('-'); return { y: +p[0], m: +p[1] }; }\n\n  function kindOf(dt) {\n    var k = keyOf(dt);\n    if (state.kindOverrides[k]) return state.kindOverrides[k];\n    if (HOLIDAY_SET[k]) return 'holiday';\n    if (MAKEUP_SET[k]) return 'makeup';\n    var w = dt.getDay();\n    return (w === 0 || w === 6) ? 'weekend' : 'workday';\n  }\n\n  /* 生成整月日期单元，含前后补位 */\n  function buildMonth(ym) {\n    var p = splitYM(ym), y = p.y, m = p.m;\n    var first = new Date(y, m - 1, 1);\n    var offset = (first.getDay() + 6) % 7;\n    var total = new Date(y, m, 0).getDate();\n    var cells = [], i, d, dt;\n\n    for (i = 0; i \u003c offset; i++) {\n      dt = new Date(y, m - 1, 1 - (offset - i));\n      cells.push({ out: true, dt: dt, key: keyOf(dt), day: dt.getDate(), kind: null, week: 0 });\n    }\n    for (d = 1; d \u003c= total; d++) {\n      dt = new Date(y, m - 1, d);\n      cells.push({\n        out: false, dt: dt, key: keyOf(dt), day: d,\n        kind: kindOf(dt),\n        week: Math.floor((offset + d - 1) / 7)\n      });\n    }\n    while (cells.length % 7 !== 0) {\n      dt = new Date(y, m - 1, total + (cells.length - offset - total) + 1);\n      cells.push({ out: true, dt: dt, key: keyOf(dt), day: dt.getDate(), kind: null, week: 0 });\n    }\n    return cells;\n  }\n\n  /* =========================================================\n   * 4. 分配算法\n   *    - 目标天数 = 总工时 / 8，按 4h 粒度\n   *    - 整天按自然周均分，余数从中间向两侧分配\n   *    - 半天追加在最后一个填报日之后\n   *    - 其余工作日 → Training，法定节假日 → Vacation\n   * =======================================================*/\n  function middleFirstOrder(n) {\n    var idx = [], i;\n    for (i = 0; i \u003c n; i++) idx.push(i);\n    idx.sort(function (a, b) {\n      var da = Math.abs(a - (n - 1) / 2), db = Math.abs(b - (n - 1) / 2);\n      if (da !== db) return da - db;\n      return a - b;\n    });\n    return idx;\n  }\n\n  function buildPlan(cells, hours, includeMakeup) {\n    var plan = Object.create(null);\n    var alloc = [], i, c;\n\n    for (i = 0; i \u003c cells.length; i++) {\n      c = cells[i];\n      if (c.out) continue;\n      if (c.kind === 'holiday') plan[c.key] = { assign: 'vacation', hours: 0 };\n      else if (c.kind === 'weekend') plan[c.key] = { assign: 'rest', hours: 0 };\n      else if (c.kind === 'makeup') plan[c.key] = { assign: 'training', hours: 0, makeup: true };\n      else plan[c.key] = { assign: 'training', hours: 0 };\n      if (c.kind === 'workday' || (c.kind === 'makeup' && includeMakeup)) alloc.push(c);\n    }\n\n    var units = Math.round(Math.max(0, hours) / 4);\n    var whole = Math.floor(units / 2);\n    var half = units % 2;\n    var warn = [];\n\n    if (whole > alloc.length) {\n      warn.push('本月可分配工作日仅 ' + alloc.length + ' 天，不足以容纳 ' + (hours / 8) + ' 天，已按 ' + alloc.length + ' 天分配。');\n      whole = alloc.length;\n      half = 0;\n    }\n\n    /* 按周分组 */\n    var byWeek = Object.create(null), weeks = [];\n    for (i = 0; i \u003c alloc.length; i++) {\n      var w = alloc[i].week;\n      if (!byWeek[w]) { byWeek[w] = []; weeks.push(w); }\n      byWeek[w].push(alloc[i]);\n    }\n    weeks.sort(function (a, b) { return a - b; });\n\n    var W = weeks.length;\n    var counts = [], order, k;\n    for (i = 0; i \u003c W; i++) counts.push(0);\n\n    if (W > 0 && whole > 0) {\n      var base = Math.floor(whole / W);\n      var rem = whole % W;\n      order = middleFirstOrder(W);\n      for (i = 0; i \u003c W; i++) counts[i] = base;\n      for (i = 0; i \u003c rem; i++) counts[order[i]] += 1;\n      /* 若某周容量不足，向后顺延 */\n      var overflow = 0;\n      for (i = 0; i \u003c W; i++) {\n        var cap = byWeek[weeks[i]].length;\n        if (counts[i] > cap) { overflow += counts[i] - cap; counts[i] = cap; }\n      }\n      var pass = 0;\n      while (overflow > 0 && pass \u003c W * 2) {\n        for (i = W - 1; i >= 0 && overflow > 0; i--) {\n          var room = byWeek[weeks[i]].length - counts[i];\n          if (room > 0) {\n            var add = Math.min(room, overflow);\n            counts[i] += add;\n            overflow -= add;\n          }\n        }\n        pass++;\n      }\n      if (overflow > 0) warn.push('部分工时未能排入，请检查该月工作日数量。');\n    }\n\n    /* 周内从首个工作日连续填报 */\n    var lastAssigned = -1;\n    for (i = 0; i \u003c W; i++) {\n      var list = byWeek[weeks[i]];\n      for (k = 0; k \u003c counts[i] && k \u003c list.length; k++) {\n        plan[list[k].key] = { assign: 'work', hours: 8 };\n        lastAssigned = alloc.indexOf(list[k]);\n      }\n    }\n\n    /* 半天 */\n    if (half) {\n      var target = null;\n      for (i = lastAssigned + 1; i \u003c alloc.length; i++) {\n        if (plan[alloc[i].key].assign !== 'work') { target = alloc[i]; break; }\n      }\n      if (!target) {\n        for (i = alloc.length - 1; i >= 0; i--) {\n          if (plan[alloc[i].key].assign !== 'work') { target = alloc[i]; break; }\n        }\n      }\n      if (target) plan[target.key] = { assign: 'work', hours: 4 };\n      else warn.push('没有多余工作日承载 4h 余量，请调整总工时。');\n    }\n\n    return { plan: plan, warn: warn, allocCount: alloc.length, weeks: W };\n  }\n\n  /* =========================================================\n   * 5. 渲染\n   * =======================================================*/\n  var el = {\n    cal: document.getElementById('cal'),\n    monthInput: document.getElementById('monthInput'),\n    hoursInput: document.getElementById('hoursInput'),\n    projInput: document.getElementById('projInput'),\n    optMakeup: document.getElementById('optMakeup'),\n    dayHint: document.getElementById('dayHint'),\n    stageTitle: document.getElementById('stageTitle'),\n    stageSub: document.getElementById('stageSub'),\n    stTarget: document.getElementById('stTarget'),\n    stAlloc: document.getElementById('stAlloc'),\n    stGap: document.getElementById('stGap'),\n    stTrain: document.getElementById('stTrain'),\n    stVac: document.getElementById('stVac'),\n    bar: document.getElementById('bar'),\n    barFill: document.getElementById('barFill'),\n    warn: document.getElementById('warn'),\n    footSource: document.getElementById('footSource'),\n    btnTheme: document.getElementById('btnTheme'),\n    toast: document.getElementById('toast')\n  };\n\n  var current = null;\n\n  function fmtDays(n) {\n    if (Math.abs(n - Math.round(n)) \u003c 1e-9) return String(Math.round(n));\n    return n.toFixed(1);\n  }\n\n  function render() {\n    var p = splitYM(state.ym), y = p.y, m = p.m;\n    var cells = buildMonth(state.ym);\n    var built = buildPlan(cells, state.hours, state.includeMakeup);\n    var plan = built.plan;\n\n    /* 合并手动覆盖：{a:'work'|'training'|'vacation'|'rest', h:8|4|0} */\n    var i, c, kk;\n    for (kk in state.overrides) {\n      if (!Object.prototype.hasOwnProperty.call(state.overrides, kk)) continue;\n      if (!plan[kk]) continue;\n      var v = state.overrides[kk];\n      if (typeof v === 'string') v = { a: v, h: v === 'work' ? 8 : 0 };\n      plan[kk] = { assign: v.a, hours: v.a === 'work' ? (v.h || 8) : 0 };\n    }\n\n    current = { cells: cells, plan: plan, built: built };\n\n    /* 表头 */\n    var frag = [];\n    for (i = 0; i \u003c 7; i++) frag.push('\u003cdiv class=\"dow' + (i >= 5 ? ' we' : '') + '\">' + WEEK_CN[i] + '\u003c/div>');\n\n    var todayKey = keyOf(new Date());\n    var sumHours = 0, sumDays = 0, trainDays = 0, vacDays = 0, workDays = 0, makeupDays = 0;\n\n    for (i = 0; i \u003c cells.length; i++) {\n      c = cells[i];\n      if (c.out) {\n        frag.push('\u003cdiv class=\"day is-out\">\u003cspan class=\"dn\">' + c.day + '\u003c/span>\u003cspan class=\"dt\">\u003c/span>\u003c/div>');\n        continue;\n      }\n      var a = plan[c.key] || { assign: 'training', hours: 0 };\n      var cls = 'day', tag = '';\n\n      if (a.assign === 'work') {\n        if (a.hours === 4) { cls += ' is-half'; tag = '4h'; } else { cls += ' is-work'; tag = '8h'; }\n        sumHours += a.hours; sumDays += a.hours / 8; workDays++;\n      } else if (a.assign === 'vacation') {\n        cls += ' is-hol'; tag = 'Vacation'; vacDays++;\n      } else if (a.assign === 'rest') {\n        cls += ' is-rest'; tag = '';\n      } else {\n        cls += ' is-train';\n        if (c.kind === 'makeup') { tag = '调休'; makeupDays++; } else { tag = 'Training'; }\n        trainDays++;\n      }\n\n      if (c.kind === 'makeup') cls += ' is-makeup';\n      if (c.key === todayKey) cls += ' is-today';\n\n      var aria = (m) + '月' + c.day + '日 周' + WEEK_CN[(c.dt.getDay() + 6) % 7] + ' ' + (tag || '休息');\n      frag.push('\u003cbutton type=\"button\" class=\"' + cls + '\" data-key=\"' + c.key + '\" aria-label=\"' + aria + '\">\u003cspan class=\"dn\">' + c.day + '\u003c/span>\u003cspan class=\"dt\">' + tag + '\u003c/span>\u003c/button>');\n    }\n\n    el.cal.innerHTML = frag.join('');\n\n    /* 顶部与统计 */\n    el.stageTitle.textContent = y + ' 年 ' + m + ' 月';\n    el.stageSub.textContent = built.allocCount + ' 个可分配工作日 · 已填 ' + fmtDays(sumDays) + ' 天';\n    el.stTarget.textContent = fmtDays(state.hours / 8) + ' 天（' + state.hours + 'h）';\n    el.stAlloc.textContent = fmtDays(sumDays) + ' 天（' + sumHours + 'h）';\n    var gap = state.hours - sumHours;\n    el.stGap.textContent = (gap === 0 ? '0h' : (gap > 0 ? '缺 ' + gap + 'h' : '超 ' + (-gap) + 'h'));\n    el.stGap.className = gap === 0 ? 'ok' : 'bad';\n    el.stTrain.textContent = trainDays + ' 天';\n    el.stVac.textContent = vacDays + ' 天';\n    document.getElementById('rowMakeup').style.display = makeupDays ? '' : 'none';\n    document.getElementById('stMakeup').textContent = makeupDays + ' 天';\n\n    var pct = state.hours > 0 ? Math.min(100, sumHours / state.hours * 100) : 0;\n    el.barFill.style.width = pct + '%';\n    el.bar.className = 'bar' + (sumHours > state.hours ? ' over' : '');\n\n    /* 提示 */\n    var warnList = built.warn.slice();\n    if (gap !== 0 && built.warn.length === 0) {\n      warnList.push(gap > 0 ? ('还差 ' + gap + 'h 未分配，可点击日期手动补足。') : ('已超出目标 ' + (-gap) + 'h，可点击日期改回 Training。'));\n    }\n    if (!KNOWN_YEARS[y]) {\n      warnList.push(y + ' 年节假日数据未内置，当前仅按周末计算；按住 Shift 点击日期可标记为节假日。');\n    }\n    if (warnList.length) { el.warn.className = 'warnbox on'; el.warn.textContent = warnList.join(' '); }\n    else { el.warn.className = 'warnbox'; el.warn.textContent = ''; }\n\n    el.dayHint.textContent = '折合 ' + fmtDays(state.hours / 8) + ' 天（每日 8h）';\n    el.footSource.textContent = KNOWN_YEARS[y] ? '节假日数据：国务院办公厅 2025-11-04 通知' : '节假日数据：未内置 ' + y + ' 年，按周末计算';\n  }\n\n  /* =========================================================\n   * 6. 交互\n   * =======================================================*/\n  function toast(msg) {\n    el.toast.textContent = msg;\n    el.toast.className = 'toast on';\n    clearTimeout(toast._t);\n    toast._t = setTimeout(function () { el.toast.className = 'toast'; }, 1600);\n  }\n\n  function codeOf(a) {\n    if (!a) return 'training';\n    if (a.assign === 'work') return a.hours === 4 ? 'work4' : 'work8';\n    return a.assign;\n  }\n\n  function cycleList(kind) {\n    if (kind === 'weekend') return ['rest', 'work8'];\n    if (kind === 'holiday') return ['vacation', 'work8', 'training'];\n    return ['training', 'work8', 'work4', 'vacation'];\n  }\n\n  el.cal.addEventListener('click', function (e) {\n    var btn = e.target.closest ? e.target.closest('.day') : null;\n    if (!btn || !btn.dataset || !btn.dataset.key) return;\n    if (btn.classList.contains('is-out')) return;\n\n    var key = btn.dataset.key;\n    var cell = null, i;\n    for (i = 0; i \u003c current.cells.length; i++) if (current.cells[i].key === key) { cell = current.cells[i]; break; }\n    if (!cell) return;\n\n    if (e.shiftKey) {\n      var kind = kindOf(cell.dt);\n      state.kindOverrides[key] = (kind === 'holiday' || kind === 'weekend') ? 'workday' : 'holiday';\n      state.overrides[key] = state.kindOverrides[key] === 'holiday'\n        ? { a: 'vacation', h: 0 }\n        : { a: 'training', h: 0 };\n      save(); render();\n      toast('已标记为' + (state.kindOverrides[key] === 'holiday' ? '节假日' : '工作日'));\n      return;\n    }\n\n    var cur = codeOf(current.plan[key]);\n    var list = cycleList(kindOf(cell.dt));\n    var idx = list.indexOf(cur);\n    var next = list[(idx + 1) % list.length];\n\n    if (next === 'work8') state.overrides[key] = { a: 'work', h: 8 };\n    else if (next === 'work4') state.overrides[key] = { a: 'work', h: 4 };\n    else state.overrides[key] = { a: next, h: 0 };\n\n    save(); render();\n  });\n\n  el.monthInput.addEventListener('change', function () {\n    var v = el.monthInput.value;\n    if (!/^\\d{4}-\\d{2}$/.test(v)) return;\n    state.ym = v;\n    state.overrides = Object.create(null);\n    save(); render();\n  });\n\n  document.getElementById('btnPrev').addEventListener('click', function () { shiftMonth(-1); });\n  document.getElementById('btnNext').addEventListener('click', function () { shiftMonth(1); });\n\n  function shiftMonth(delta) {\n    var p = splitYM(state.ym), d = new Date(p.y, p.m - 1 + delta, 1);\n    state.ym = d.getFullYear() + '-' + pad2(d.getMonth() + 1);\n    state.overrides = Object.create(null);\n    el.monthInput.value = state.ym;\n    save(); render();\n  }\n\n  el.hoursInput.addEventListener('input', function () {\n    var v = parseFloat(el.hoursInput.value);\n    if (!isFinite(v) || v \u003c 0) return;\n    state.hours = v;\n    state.overrides = Object.create(null);\n    save(); render();\n  });\n\n  el.projInput.addEventListener('input', function () {\n    state.project = el.projInput.value.trim() || 'Project';\n    save();\n  });\n\n  el.optMakeup.addEventListener('change', function () {\n    state.includeMakeup = el.optMakeup.checked;\n    state.overrides = Object.create(null);\n    save(); render();\n  });\n\n  document.getElementById('btnAuto').addEventListener('click', function () {\n    state.overrides = Object.create(null);\n    save(); render();\n    toast('已按自然周重新分配');\n  });\n\n  document.getElementById('btnReset').addEventListener('click', function () {\n    state.overrides = Object.create(null);\n    state.kindOverrides = Object.create(null);\n    save(); render();\n    toast('已清除所有手动调整');\n  });\n\n  /* 导出 */\n  function rowsForExport() {\n    var out = [], i, c, a;\n    for (i = 0; i \u003c current.cells.length; i++) {\n      c = current.cells[i];\n      if (c.out) continue;\n      a = current.plan[c.key] || { assign: 'training', hours: 0 };\n      var name = a.assign === 'work' ? state.project : (a.assign === 'vacation' ? 'Vacation' : (a.assign === 'rest' ? '' : 'Training'));\n      out.push([c.key, '周' + WEEK_CN[(c.dt.getDay() + 6) % 7], name, a.assign === 'work' ? a.hours : 0]);\n    }\n    return out;\n  }\n\n  function download(name, text) {\n    var blob = new Blob(['\\ufeff' + text], { type: 'text/csv;charset=utf-8' });\n    var url = URL.createObjectURL(blob);\n    var a = document.createElement('a');\n    a.href = url; a.download = name;\n    document.body.appendChild(a); a.click(); a.remove();\n    setTimeout(function () { URL.revokeObjectURL(url); }, 500);\n  }\n\n  document.getElementById('btnCsv').addEventListener('click', function () {\n    var rows = rowsForExport();\n    var lines = ['日期,星期,项目,工时'];\n    var i;\n    for (i = 0; i \u003c rows.length; i++) lines.push(rows[i].join(','));\n    download('timesheet-' + state.ym + '.csv', lines.join('\\r\\n'));\n    toast('已导出 CSV');\n  });\n\n  document.getElementById('btnCopy').addEventListener('click', function () {\n    var rows = rowsForExport();\n    var lines = ['日期\\t星期\\t项目\\t工时'];\n    var i;\n    for (i = 0; i \u003c rows.length; i++) {\n      if (!rows[i][2] && rows[i][3] === 0) continue;\n      lines.push(rows[i].join('\\t'));\n    }\n    var text = lines.join('\\n');\n    if (navigator.clipboard && navigator.clipboard.writeText) {\n      navigator.clipboard.writeText(text).then(function () { toast('已复制 ' + (lines.length - 1) + ' 行'); },\n        function () { toast('复制失败，请改用导出 CSV'); });\n    } else {\n      var ta = document.createElement('textarea');\n      ta.value = text; document.body.appendChild(ta); ta.select();\n      try { document.execCommand('copy'); toast('已复制'); } catch (e) { toast('复制失败'); }\n      ta.remove();\n    }\n  });\n\n  /* 主题 */\n  function applyTheme() {\n    document.documentElement.setAttribute('data-theme', state.theme);\n    el.btnTheme.textContent = state.theme === 'dark' ? '切换浅色' : '切换深色';\n  }\n  el.btnTheme.addEventListener('click', function () {\n    state.theme = state.theme === 'dark' ? 'light' : 'dark';\n    applyTheme(); save();\n  });\n\n  /* =========================================================\n   * 7. 启动\n   * =======================================================*/\n  load();\n  el.monthInput.value = state.ym;\n  el.hoursInput.value = state.hours;\n  el.projInput.value = state.project;\n  el.optMakeup.checked = state.includeMakeup;\n  applyTheme();\n  render();\n\n  window.__timesheet = { state: state, buildPlan: buildPlan, buildMonth: buildMonth, render: render };\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","diff":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\" data-theme=\"light\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Diff Viewer · 本地文本对比工具\u003c/title>\n\u003c!-- Favicon adapted from Tabler Icons file-diff, https://tabler.io/icons/icon/file-diff\nMIT License\nCopyright (c) 2020-2025 Paweł Kuna\nPermission is hereby granted, free of charge, to any person obtaining a copy\nof this software and associated documentation files (the \"Software\"), to deal\nin the Software without restriction, including without limitation the rights\nto use, copy, modify, merge, publish, distribute, sublicense, and/or sell\ncopies of the Software, and to permit persons to whom the Software is\nfurnished to do so, subject to the following conditions:\nThe above copyright notice and this permission notice shall be included in all\ncopies or substantial portions of the Software.\nTHE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR\nIMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,\nFITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE\nAUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER\nLIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,\nOUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE\nSOFTWARE.\n-->\n\u003clink rel=\"icon\" type=\"image/svg+xml\" sizes=\"any\" href=\"data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='%230969da'%20stroke-width='2'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='M14%203v4a1%201%200%200%200%201%201h4M17%2021H7a2%202%200%200%201-2-2V5a2%202%200%200%201%202-2h7l5%205v11a2%202%200%200%201-2%202z'/%3E%3Cpath%20stroke='%231a7f37'%20d='M12%2010v4m-2-2h4'/%3E%3Cpath%20stroke='%23cf222e'%20d='M10%2017h4'/%3E%3C/svg%3E\">\n\u003cstyle>\n:root{\n  --mono: ui-monospace, SFMono-Regular, \"SF Mono\", Menlo, Consolas, \"Liberation Mono\", \"Cascadia Mono\", \"Microsoft YaHei\", monospace;\n  --bg:#ffffff; --bg-soft:#f6f8fa; --bg-sub:#eef1f4;\n  --border:#d0d7de; --border-soft:#e6eaef;\n  --text:#1f2328; --muted:#656d76;\n  --accent:#0969da; --accent-soft:#ddf4ff; --accent-fg:#ffffff;\n  --add-bg:#d9f7e4; --add-line:#b3ecc7; --add-word:#7fdda0; --add-bar:#2da44e;\n  --del-bg:#ffe1e1; --del-line:#ffc6c6; --del-word:#ff9d9d; --del-bar:#e5534b;\n  --green:#1a7f37; --green-h:#15702f; --red:#cf222e;\n  --warn-bg:#fff3c4; --warn-fg:#7a4f01;\n  /* 对齐常量：JS 启动时从这里读取，不要在脚本里再写死 */\n  --lh: 20px;\n  --pt: 8px;\n  --pl: 12px;\n  /* 行号列宽度 = 符号列 + 间隙 + 右内边距 + N 位数字，三者同源，改一处即可 */\n  --signw: 13px;\n  --gutgap: 3px;\n  --gutpad: 8px;\n  --lnw: calc(var(--signw) + var(--gutgap) + var(--gutpad) + 3ch);\n}\nhtml[data-theme=\"dark\"]{\n  --bg:#0d1117; --bg-soft:#161b22; --bg-sub:#1c2129;\n  --border:#30363d; --border-soft:#21262d;\n  --text:#e6edf3; --muted:#8b949e;\n  --accent:#2f81f7; --accent-soft:#0d2d63; --accent-fg:#ffffff;\n  --add-bg:#123a25; --add-line:#1a5233; --add-word:#2c9155; --add-bar:#3fb950;\n  --del-bg:#3d161a; --del-line:#5c2026; --del-word:#a03740; --del-bar:#f85149;\n  --green:#238636; --green-h:#2ea043; --red:#f85149;\n  --warn-bg:#3a2d00; --warn-fg:#e3b341;\n}\n*{box-sizing:border-box}\nhtml,body{height:100%}\nbody{\n  margin:0; background:var(--bg); color:var(--text);\n  font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",\"Noto Sans SC\",\"PingFang SC\",\"Microsoft YaHei\",sans-serif;\n  font-size:14px; display:flex; flex-direction:column; overflow:hidden;\n  -webkit-font-smoothing:antialiased;\n}\n\n/* ---------- 顶栏 ---------- */\n.topbar{\n  flex:0 0 auto; display:flex; align-items:center; flex-wrap:wrap; gap:8px;\n  padding:7px 13px; background:var(--bg-soft); border-bottom:1px solid var(--border);\n}\n.brand{display:flex; align-items:baseline; gap:7px; font-weight:600; letter-spacing:.2px}\n.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);align-self:center}\n.brand .sub{font-weight:400; font-size:12px; color:var(--muted)}\n.spacer{margin-left:auto}\nbutton{\n  font:inherit; font-size:13px; padding:4px 11px; border-radius:6px; cursor:pointer;\n  border:1px solid var(--border); background:var(--bg); color:var(--text);\n  transition:background .12s, border-color .12s; white-space:nowrap;\n}\nbutton:hover{background:var(--bg-sub)}\nbutton:active{transform:translateY(.5px)}\nbutton.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-fg); font-weight:500}\nbutton.primary:hover{filter:brightness(1.08); background:var(--accent)}\nlabel.chk{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; color:var(--muted); cursor:pointer; user-select:none; white-space:nowrap}\nlabel.chk input{accent-color:var(--accent); margin:0; cursor:pointer}\n\n.pill{\n  display:inline-flex; align-items:center; padding:1px 8px; border-radius:20px;\n  font-variant-numeric:tabular-nums; font-weight:600; font-size:11.5px;\n}\n.pill.add{background:var(--add-bg); color:var(--green)}\n.pill.del{background:var(--del-bg); color:var(--red)}\n.pill.mod{background:var(--accent-soft); color:var(--accent)}\n.pill.same{background:var(--bg-sub); color:var(--muted)}\n.pill.warn{background:var(--warn-bg); color:var(--warn-fg); font-weight:600; cursor:help}\n.pill.warn[hidden]{display:none}\n.stat-inline{display:flex; align-items:center; gap:5px; margin-left:4px}\n/* 差异跳转：紧凑按钮 + 位置指示，塞进统计区，不额外占一行 */\n.nav{\n  font-size:12px; line-height:16px; padding:0 6px; border-radius:4px; cursor:pointer;\n  border:1px solid var(--border); background:var(--bg); color:var(--text);\n  font-variant-numeric:tabular-nums;\n}\n.nav:hover:not(:disabled){background:var(--bg-sub)}\n.nav:disabled{opacity:.35; cursor:default}\n.navpos{font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; min-width:34px; text-align:center}\nselect.enc{\n  font:inherit; font-size:11.5px; padding:1px 2px; border-radius:5px; cursor:pointer;\n  border:1px solid var(--border); background:var(--bg-soft); color:var(--muted);\n}\nselect.enc:hover{background:var(--bg-sub)}\n\n/* ---------- 双栏编辑区（自带差异高亮）---------- */\n.workspace{flex:1 1 auto; min-height:0; display:grid; grid-template-columns:1fr 1fr; background:var(--bg-soft)}\n.pane{display:flex; flex-direction:column; min-width:0; min-height:0}\n.pane + .pane{border-left:1px solid var(--border)}\n.pane-head{\n  flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:4px 10px;\n  font-size:12px; color:var(--muted); background:var(--bg); border-bottom:1px solid var(--border-soft);\n}\n.pane-head .label{margin-right:auto; font-weight:600; color:var(--text)}\n.pane-head .count{font-variant-numeric:tabular-nums}\n.mini{\n  font-size:12px; padding:2px 9px; border-radius:5px; cursor:pointer;\n  border:1px solid var(--border); background:var(--bg-soft); color:var(--text);\n}\n.mini:hover{background:var(--bg-sub)}\n\n.editor{flex:1 1 auto; min-height:0; display:flex; background:var(--bg); overflow:hidden; position:relative}\n\n/* 行号列 */\n.gutter{\n  flex:0 0 auto; width:var(--lnw); overflow:hidden; position:relative;\n  background:var(--bg-soft); border-right:1px solid var(--border-soft);\n  font-family:var(--mono); font-size:12px;   /* 与 .gn 同源，--lnw 里的 ch 才准 */\n}\n.gutter-inner{position:absolute; top:0; left:0; width:100%; will-change:transform}\n.gn{\n  position:absolute; right:0; left:0; height:var(--lh); line-height:var(--lh);\n  text-align:right; padding-right:var(--gutpad); padding-left:calc(var(--signw) + var(--gutgap));\n  font-family:var(--mono);\n  font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums;\n}\n.gn::before{\n  position:absolute; left:0; top:0; width:var(--signw); text-align:center;\n  font-weight:700; font-size:12px; color:transparent;\n}\n.gn.del{background:var(--del-line); color:var(--red)}\n.gn.del::before{content:'\\2212'; color:var(--del-bar)}\n.gn.ins{background:var(--add-line); color:var(--green)}\n.gn.ins::before{content:'+'; color:var(--add-bar)}\n/* 修改行：底色/配色沿用该侧 del|ins，符号改成 ~（与统计 pill 的语义一致）。\n   必须写在上面两条 ::before 之后，同优先级靠顺序覆盖 content；color 继续沿用该侧的 --*-bar。 */\n.gn.mod::before{content:'~'}\n\n/* 代码区 */\n.code-wrap{flex:1 1 auto; position:relative; min-width:0; overflow:hidden}\n.hl-bg{position:absolute; inset:0; overflow:hidden; pointer-events:none; will-change:transform}\n.hl-line{position:absolute; left:0; right:0; height:var(--lh)}\n.hl-line.del{background:var(--del-bg); box-shadow:inset 3px 0 0 var(--del-bar)}\n.hl-line.ins{background:var(--add-bg); box-shadow:inset 3px 0 0 var(--add-bar)}\n\n/* ===== 字形声明只写一处 =====\n   textarea 与「影子文本」必须逐项一致（字体/字号/行高/字距/tab 宽度/空白策略），\n   否则字符级色块会整体错位。任何一项改动都只改这条规则。 */\ntextarea.src, .hl-chars .hline{\n  font-family:var(--mono); font-size:12.5px; line-height:var(--lh);\n  letter-spacing:0; tab-size:4; white-space:pre;\n}\n\n.hl-chars{\n  position:absolute; top:var(--pt); left:var(--pl);\n  pointer-events:none; will-change:transform;\n}\n.hl-chars .hline{position:absolute; left:0}\n.hl-chars .c{color:transparent}\n.hl-chars .w-del{background:var(--del-word); border-radius:2px; color:transparent}\n.hl-chars .w-ins{background:var(--add-word); border-radius:2px; color:transparent}\n\n/* 只保留布局/skin 属性，字形属性见上方共享规则 */\ntextarea.src{\n  position:absolute; inset:0; width:100%; height:100%;\n  padding:var(--pt) var(--pl);\n  border:0; outline:none; resize:none; background:transparent; color:var(--text);\n  overflow:auto;\n}\ntextarea.src.drag{background:var(--accent-soft)}\ntextarea.src::placeholder{color:var(--muted)}\n\n/* ---------- 详细对比面板（按需打开）---------- */\n.detail{position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; background:var(--bg)}\n.detail[hidden]{display:none}\n.detail-head{\n  flex:0 0 auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap;\n  padding:7px 13px; background:var(--bg-soft); border-bottom:1px solid var(--border);\n}\n.detail-head .title{font-weight:600; font-size:13.5px}\n.detail-head .meta{color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums}\n.diff-view{\n  flex:1 1 auto; min-height:0; overflow:auto; background:var(--bg);\n  font-family:var(--mono); font-size:12.5px; line-height:1.65;\n}\n.row{display:flex; align-items:stretch; min-height:1.65em}\n.cell{display:flex; flex:1 1 0; min-width:0}\n.cell.left{border-right:1px solid var(--border)}\n.ln{\n  flex:0 0 auto; width:var(--lnw); padding:0 8px 0 4px; text-align:right;\n  color:var(--muted); background:var(--bg-soft); border-right:1px solid var(--border-soft);\n  user-select:none; font-variant-numeric:tabular-nums; font-size:12px;\n}\n.tx{flex:1 1 auto; min-width:0; padding:0 10px; white-space:pre-wrap; word-break:break-word; min-height:1.65em}\n.row.del .cell.left{background:var(--del-bg)}\n.row.del .cell.left .ln{background:var(--del-line); color:var(--red)}\n.row.ins .cell.right{background:var(--add-bg)}\n.row.ins .cell.right .ln{background:var(--add-line); color:var(--green)}\n.row.mod .cell.left{background:var(--del-bg)}\n.row.mod .cell.left .ln{background:var(--del-line); color:var(--red)}\n.row.mod .cell.right{background:var(--add-bg)}\n.row.mod .cell.right .ln{background:var(--add-line); color:var(--green)}\n.cell.empty{background-image:repeating-linear-gradient(-45deg, var(--bg-soft) 0 7px, transparent 7px 14px)}\n.cell.empty .ln{background:transparent}\n.w-del-mark{background:var(--del-word); border-radius:2px; padding:0 1px}\n.w-ins-mark{background:var(--add-word); border-radius:2px; padding:0 1px}\n\n.fold{\n  display:flex; align-items:center; justify-content:center; padding:3px 0;\n  background:var(--bg-soft); border-top:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft);\n}\n.fold button{font-size:11.5px; padding:1px 12px; border-radius:20px; color:var(--accent); background:var(--bg); border:1px solid var(--border)}\n.fold button:hover{background:var(--accent-soft)}\n.placeholder{\n  display:flex; align-items:center; justify-content:center; height:100%;\n  color:var(--muted); font-size:13px; text-align:center; padding:24px;\n  font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",\"Microsoft YaHei\",sans-serif;\n}\n\n@media (max-width: 860px){\n  .workspace{grid-template-columns:1fr; grid-template-rows:1fr 1fr}\n  .pane + .pane{border-left:0; border-top:1px solid var(--border)}\n  .brand .sub{display:none}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"topbar\">\n  \u003cdiv class=\"brand\">\u003cspan class=\"dot\">\u003c/span>Diff Viewer\u003cspan class=\"sub\">本地文本对比\u003c/span>\u003c/div>\n\n  \u003cdiv class=\"stat-inline\" id=\"statInline\">\n    \u003cspan class=\"pill add\" id=\"pAdd\">+0\u003c/span>\n    \u003cspan class=\"pill del\" id=\"pDel\">−0\u003c/span>\n    \u003cspan class=\"pill mod\" id=\"pMod\">~0\u003c/span>\n    \u003cspan class=\"pill same\" id=\"pSame\">=0\u003c/span>\n    \u003cspan class=\"pill warn\" id=\"pWarn\" hidden>⚠ 已降级对齐\u003c/span>\n    \u003cbutton class=\"nav\" id=\"navPrev\" title=\"上一处差异 (Alt+↑)\" disabled>↑\u003c/button>\n    \u003cbutton class=\"nav\" id=\"navNext\" title=\"下一处差异 (Alt+↓)\" disabled>↓\u003c/button>\n    \u003cspan class=\"navpos\" id=\"navPos\" title=\"当前差异位置\">0/0\u003c/span>\n  \u003c/div>\n\n  \u003cspan class=\"spacer\">\u003c/span>\n\n  \u003clabel class=\"chk\">\u003cinput type=\"checkbox\" id=\"optWs\"> 忽略空白\u003c/label>\n  \u003cbutton id=\"btnSwap\" title=\"交换左右两侧文本\">交换\u003c/button>\n  \u003cbutton id=\"btnSample\">示例\u003c/button>\n  \u003cbutton id=\"btnClear\">清空\u003c/button>\n  \u003cbutton id=\"btnTheme\" title=\"切换浅色/深色\">深色\u003c/button>\n  \u003cbutton id=\"btnDetail\" class=\"primary\" title=\"打开并排详细对比 (Ctrl+Enter)\">详细对比\u003c/button>\n\u003c/header>\n\n\u003cmain class=\"workspace\">\n\n  \u003csection class=\"pane\">\n    \u003cdiv class=\"pane-head\">\n      \u003cspan class=\"label\">原始文本\u003c/span>\n      \u003cspan class=\"count\" id=\"cntL\">0 行\u003c/span>\n      \u003cselect class=\"enc\" id=\"encL\" title=\"文件编码（仅对已加载的文件生效）\">\n        \u003coption value=\"auto\">自动\u003c/option>\n        \u003coption value=\"utf-8\">UTF-8\u003c/option>\n        \u003coption value=\"gbk\">GBK\u003c/option>\n      \u003c/select>\n      \u003clabel class=\"mini\">选择文件\u003cinput type=\"file\" id=\"fileL\" hidden>\u003c/label>\n      \u003cbutton class=\"mini\" data-clear=\"L\">清空\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"editor\">\n      \u003cdiv class=\"gutter\">\u003cdiv class=\"gutter-inner\" id=\"gutL\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"code-wrap\">\n        \u003cdiv class=\"hl-bg\" id=\"bgL\">\u003c/div>\n        \u003cdiv class=\"hl-chars\" id=\"chL\">\u003c/div>\n        \u003ctextarea class=\"src\" id=\"taL\" wrap=\"off\" spellcheck=\"false\" placeholder=\"粘贴原始文本，或拖入文件…\">\u003c/textarea>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"pane\">\n    \u003cdiv class=\"pane-head\">\n      \u003cspan class=\"label\">对比文本\u003c/span>\n      \u003cspan class=\"count\" id=\"cntR\">0 行\u003c/span>\n      \u003cselect class=\"enc\" id=\"encR\" title=\"文件编码（仅对已加载的文件生效）\">\n        \u003coption value=\"auto\">自动\u003c/option>\n        \u003coption value=\"utf-8\">UTF-8\u003c/option>\n        \u003coption value=\"gbk\">GBK\u003c/option>\n      \u003c/select>\n      \u003clabel class=\"mini\">选择文件\u003cinput type=\"file\" id=\"fileR\" hidden>\u003c/label>\n      \u003cbutton class=\"mini\" data-clear=\"R\">清空\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"editor\">\n      \u003cdiv class=\"gutter\">\u003cdiv class=\"gutter-inner\" id=\"gutR\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"code-wrap\">\n        \u003cdiv class=\"hl-bg\" id=\"bgR\">\u003c/div>\n        \u003cdiv class=\"hl-chars\" id=\"chR\">\u003c/div>\n        \u003ctextarea class=\"src\" id=\"taR\" wrap=\"off\" spellcheck=\"false\" placeholder=\"粘贴新文本，或拖入文件…\">\u003c/textarea>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n\u003c/main>\n\n\u003c!-- 详细对比：并排 + 字符级高亮 + 折叠，按需打开 -->\n\u003cdiv class=\"detail\" id=\"detail\" hidden>\n  \u003cdiv class=\"detail-head\">\n    \u003cspan class=\"title\">并排详细对比\u003c/span>\n    \u003cspan class=\"meta\" id=\"detailMeta\">\u003c/span>\n    \u003cspan class=\"spacer\">\u003c/span>\n    \u003clabel class=\"chk\">\u003cinput type=\"checkbox\" id=\"optFold\" checked> 折叠未变更\u003c/label>\n    \u003cbutton id=\"btnCloseDetail\">关闭\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"diff-view\" id=\"diffView\">\u003c/div>\n\u003c/div>\n\n\u003cscript>\n(function () {\n  'use strict';\n\n  var $ = function (id) { return document.getElementById(id); };\n  var taL = $('taL'), taR = $('taR');\n\n  /* 对齐常量从 CSS 自定义属性读取，避免与样式表两处硬编码不同步。\n     （script 在 body 末尾执行，样式已生效；取不到时按默认值兜底。） */\n  function cssPx(name, dflt) {\n    var v = '';\n    try { v = getComputedStyle(document.documentElement).getPropertyValue(name); } catch (e) { v = ''; }\n    var n = parseFloat(v);\n    return isFinite(n) ? n : dflt;\n  }\n  var LH = cssPx('--lh', 20);\n  var PAD_T = cssPx('--pt', 8);\n  var PAD_L = cssPx('--pl', 12);\n\n  var FOLD_CTX = 3;\n  var CHAR_DIFF_LIMIT = 3000;\n  var CHAR_DIFF_LIMIT_OPS = 256;   // 字符级 Myers 的层数上限（行级是 1200）\n\n  /* =========================================================\n   * 1. 差异内核（Myers O(ND)，带前后缀裁剪与降级保护）\n   * =======================================================*/\n  /* 返回 { ops, degraded }。degraded 为 true 表示编辑距离超出 limit，\n     结果已退化为「全删 + 全增」，调用方必须把这件事告诉用户。 */\n  function myers(a, b, eq, limit) {\n    var n = a.length, m = b.length;\n    if (n === 0 && m === 0) return { ops: [], degraded: false };\n    if (n === 0) { var r1 = [], i1; for (i1 = 0; i1 \u003c m; i1++) r1.push({ t: 2, bi: i1 }); return { ops: r1, degraded: false }; }\n    if (m === 0) { var r2 = [], i2; for (i2 = 0; i2 \u003c n; i2++) r2.push({ t: 1, ai: i2 }); return { ops: r2, degraded: false }; }\n\n    var max = n + m;\n    var LIMIT = Math.min(max, limit || 1200);\n    var off = max + 1;\n    var v = new Int32Array(2 * max + 3);\n    var trace = [];\n    var d = 0, done = false, k, x, y;\n\n    for (; d \u003c= LIMIT; d++) {\n      trace.push(d === 0 ? null : v.slice(off - (d - 1), off + (d - 1) + 1));\n      done = false;\n      for (k = -d; k \u003c= d; k += 2) {\n        if (k === -d || (k !== d && v[off + k - 1] \u003c v[off + k + 1])) x = v[off + k + 1];\n        else x = v[off + k - 1] + 1;\n        y = x - k;\n        while (x \u003c n && y \u003c m && eq(a[x], b[y])) { x++; y++; }\n        v[off + k] = x;\n        if (x >= n && y >= m) { done = true; break; }\n      }\n      if (done) break;\n    }\n\n    if (!done) {\n      var fb = [], i;\n      for (i = 0; i \u003c n; i++) fb.push({ t: 1, ai: i });\n      for (i = 0; i \u003c m; i++) fb.push({ t: 2, bi: i });\n      return { ops: fb, degraded: true };\n    }\n\n    var ops = [];\n    x = n; y = m;\n    for (var dd = d; dd > 0; dd--) {\n      var snap = trace[dd];\n      var base = dd - 1;\n      var get = function (kk) { return snap[kk + base]; };\n      var kk2 = x - y;\n      var prevK;\n      if (kk2 === -dd || (kk2 !== dd && get(kk2 - 1) \u003c get(kk2 + 1))) prevK = kk2 + 1;\n      else prevK = kk2 - 1;\n      var prevX = get(prevK);\n      var prevY = prevX - prevK;\n      while (x > prevX && y > prevY) { ops.push({ t: 0, ai: x - 1, bi: y - 1 }); x--; y--; }\n      if (x > prevX) { ops.push({ t: 1, ai: x - 1 }); x--; }\n      else { ops.push({ t: 2, bi: y - 1 }); y--; }\n    }\n    while (x > 0 && y > 0) { ops.push({ t: 0, ai: --x, bi: --y }); }\n    while (x > 0) { ops.push({ t: 1, ai: --x }); }\n    while (y > 0) { ops.push({ t: 2, bi: --y }); }\n    ops.reverse();\n    return { ops: ops, degraded: false };\n  }\n\n  /* flags 可选：仅行级比对传，用于把「降级」透传给 UI。\n     字符级比对不传，避免一行字符级超限被误报成整体降级。 */\n  function diffCore(a, b, eq, flags, limit) {\n    var n = a.length, m = b.length;\n    var pre = 0;\n    while (pre \u003c n && pre \u003c m && eq(a[pre], b[pre])) pre++;\n    var suf = 0;\n    while (suf \u003c n - pre && suf \u003c m - pre && eq(a[n - 1 - suf], b[m - 1 - suf])) suf++;\n\n    var A = a.slice(pre, n - suf), B = b.slice(pre, m - suf);\n    var out = [], i;\n    for (i = 0; i \u003c pre; i++) out.push({ t: 0, ai: i, bi: i });\n\n    var r = myers(A, B, eq, limit);\n    if (r.degraded && flags) flags.degraded = true;\n    var mid = r.ops;\n    for (i = 0; i \u003c mid.length; i++) {\n      var o = mid[i];\n      if (o.t === 0) out.push({ t: 0, ai: o.ai + pre, bi: o.bi + pre });\n      else if (o.t === 1) out.push({ t: 1, ai: o.ai + pre });\n      else out.push({ t: 2, bi: o.bi + pre });\n    }\n    for (i = 0; i \u003c suf; i++) out.push({ t: 0, ai: n - suf + i, bi: m - suf + i });\n    return out;\n  }\n\n  /* 行相似度：公共前缀 + 公共后缀占比 */\n  function similarity(s1, s2) {\n    if (!s1 && !s2) return 1;\n    if (!s1 || !s2) return 0;\n    var t1 = s1.trim(), t2 = s2.trim();\n    if (t1 === t2) return 1;\n    var a = t1.length, b = t2.length;\n    if (!a || !b) return 0;\n    var n = Math.min(a, b), p = 0, q = 0;\n    while (p \u003c n && t1.charCodeAt(p) === t2.charCodeAt(p)) p++;\n    while (q \u003c n - p && t1.charCodeAt(a - 1 - q) === t2.charCodeAt(b - 1 - q)) q++;\n    return (p + q) / Math.max(a, b);\n  }\n\n  var SIM_THRESHOLD = 0.35;\n\n  /* 把一个「连续非 eq」的变更块折成成对行。\n     配对策略：**逐对独立判定**，没有任何块级/前缀式的整体决策——\n     某对相似度不达标就地拆成「删 + 增」，绝不因为邻居合格而被强配成 mod，\n     也不会因为前一对不合格而使后面合格的对照样被埋没（块内断崖）。\n     输出顺序按 diff 工具惯例：连续不合格段内部是「删块 + 增块」，不逐对交替；\n     合格对（mod）作为分隔。dels[k]/inss[k] 各自严格递增，\n     所以无论怎么分段，左右两列的行号在各自列内都严格递增。 */\n  function buildRows(ops, aLines, bLines, degraded) {\n    var rows = [], i = 0, k;\n    while (i \u003c ops.length) {\n      if (ops[i].t === 0) { rows.push({ type: 'eq', a: ops[i].ai, b: ops[i].bi }); i++; continue; }\n\n      var dels = [], inss = [];\n      while (i \u003c ops.length && ops[i].t !== 0) {\n        if (ops[i].t === 1) dels.push(ops[i].ai);\n        else inss.push(ops[i].bi);\n        i++;\n      }\n\n      var limit = Math.min(dels.length, inss.length);\n      var single = (dels.length === 1 && inss.length === 1);\n\n      // 待刷缓冲：先攒够一段连续不合格对，再一次性「先全部 del、再全部 ins」\n      var pendDel = [], pendIns = [];\n      var flushPending = function () {\n        var p;\n        for (p = 0; p \u003c pendDel.length; p++) rows.push({ type: 'del', a: pendDel[p], b: null });\n        for (p = 0; p \u003c pendIns.length; p++) rows.push({ type: 'ins', a: null, b: pendIns[p] });\n        pendDel.length = 0;\n        pendIns.length = 0;\n      };\n\n      for (k = 0; k \u003c limit; k++) {\n        var s = similarity(aLines[dels[k]], bLines[inss[k]]);\n        // 单行对单行：门槛放到 0.1（否则两条无关的等长文本永远拆不开）；\n        // 多行块内仍用 SIM_THRESHOLD，避免把「整块重写」误判成一串修改。\n        // 注：!degraded 在此处实际不可达——降级要求编辑距离 >1200，而单对单块距离恒为 2；\n        // 保留它只是防止未来改上限后出现「降级 + 强配」叠加、把错误藏得更深。\n        var pass = (single && !degraded) ? (s >= 0.1) : (s >= SIM_THRESHOLD);\n        if (pass) {\n          flushPe tailTo(el) {\n    var view = $('diffView');\n    if (!el) return;\n    var top = el.offsetTop - view.offsetTop;\n    view.scrollTop = Math.max(0, top - view.clientHeight / 2 + el.offsetHeight / 2);\n  }\n\n  /* dir: 1 下一处 / -1 上一处 */\n  function gotoBlock(dir) {\n    var res = lastRes;\n    var n = (res && res.blocks) ? res.blocks.length : 0;\n    if (!n) return;\n    if (curBlock \u003c 0) curBlock = (dir > 0) ? 0 : n - 1;\n    else curBlock = ((curBlock + dir) % n + n) % n;\n\n    var blk = res.blocks[curBlock];\n    if (!$('detail').hidden) {\n      scrollDetailTo($('diffView').querySelector('[data-block=\"' + curBlock + '\"]'));\n    } else {\n      centerLine(taL, blk.aAt);\n      centerLine(taR, blk.bAt);\n      syncScroll('L');\n      syncScroll('R');\n    }\n    $('navPos').textContent = (curBlock + 1) + '/' + n;\n  }\n\n  var lastRes = null, lastCost = 0, timer = null;\n\n  function refresh() {\n    // 详细面板是全屏覆盖层：打开时下层的三层高亮完全被遮挡，重算纯属浪费\n    if (!$('detail').hidden) return lastRes;\n\n    var t0 = (window.performance && performance.now) ? performance.now() : Date.now();\n    var res = analyze();\n    lastRes = res;\n    renderSide('L', res);\n    renderSide('R', res);\n    updateStats(res);\n    $('cntL').textContent = res.aLines.length + ' 行';\n    $('cntR').textContent = res.bLines.length + ' 行';\n    var t1 = (window.performance && performance.now) ? performance.now() : Date.now();\n    lastCost = Math.max(1, Math.round(t1 - t0));\n    return res;\n  }\n\n  function scheduleRefresh() {\n    clearTimeout(timer);\n    timer = setTimeout(refresh, 160);\n  }\n\n  /* =========================================================\n   * 4. 详细对比面板（并排 + 折叠）\n   * =======================================================*/\n  function foldEqRows(rows, ctx) {\n    var out = [], i = 0;\n    while (i \u003c rows.length) {\n      if (rows[i].type !== 'eq') { out.push(rows[i]); i++; continue; }\n      var j = i;\n      while (j \u003c rows.length && rows[j].type === 'eq') j++;\n      var len = j - i;\n      if (len > ctx * 2 + 1) {\n        var k;\n        for (k = i; k \u003c i + ctx; k++) out.push(rows[k]);\n        out.push({ type: 'fold', count: len - ctx * 2, rows: rows.slice(i + ctx, j - ctx) });\n        for (k = j - ctx; k \u003c j; k++) out.push(rows[k]);\n      } else {\n        for (var k2 = i; k2 \u003c j; k2++) out.push(rows[k2]);\n      }\n      i = j;\n    }\n    return out;\n  }\n\n  function renderDetail(res) {\n    var view = $('diffView');\n    if (!res) return;\n    var aLines = res.aLines, bLines = res.bLines;\n\n    // .ln 的内边距是 4+8，与主编辑区的 --lnw 不是同一套算法，这里单独算\n    var digits = Math.max(3, String(Math.max(aLines.length, bLines.length, 1)).length);\n    view.style.setProperty('--lnw', 'calc(12px + ' + digits + 'ch)');\n\n    function makeCell(side, idx, lines, segs) {\n      var cell = document.createElement('div');\n      cell.className = 'cell ' + side;\n      var ln = document.createElement('span');\n      ln.className = 'ln';\n      var tx = document.createElement('span');\n      tx.className = 'tx';\n      if (idx == null) {\n        cell.classList.add('empty');\n      } else {\n        ln.textContent = String(idx + 1);\n        if (segs) {\n          for (var i = 0; i \u003c segs.length; i++) {\n            var s = segs[i];\n            if (s.t === 0) tx.appendChild(document.createTextNode(s.text));\n            else {\n              var sp = document.createElement('span');\n              sp.className = (side === 'left' ? 'w-del-mark' : 'w-ins-mark');\n              sp.textContent = s.text;\n              tx.appendChild(sp);\n            }\n          }\n        } else {\n          tx.textContent = lines[idx];\n        }\n      }\n      cell.appendChild(ln);\n      cell.appendChild(tx);\n      return cell;\n    }\n\n    function build(r) {\n      if (r.type === 'fold') {\n        var box = document.createElement('div');\n        box.className = 'fold';\n        var btn = document.createElement('button');\n        btn.textContent = '展开 ' + r.count + ' 行未变更';\n        btn.addEventListener('click', function () {\n          var frag = document.createDocumentFragment();\n          for (var i = 0; i \u003c r.rows.length; i++) frag.appendChild(build(r.rows[i]));\n          box.parentNode.insertBefore(frag, box);\n          box.remove();\n        });\n        box.appendChild(btn);\n        return box;\n      }\n      var row = document.createElement('div');\n      row.className = 'row ' + r.type;\n      if (r.blk != null) row.setAttribute('data-block', String(r.blk));\n      var segL = (r.type === 'mod') ? res.leftSegs[r.a] : null;\n      var segR = (r.type === 'mod') ? res.rightSegs[r.b] : null;\n      row.appendChild(makeCell('left', r.a, aLines, segL));\n      row.appendChild(makeCell('right', r.b, bLines, segR));\n      return row;\n    }\n\n    var display = $('optFold').checked ? foldEqRows(res.rows, FOLD_CTX) : res.rows;\n\n    if (!display.length) {\n      view.innerHTML = '\u003cdiv class=\"placeholder\">两侧都还没有内容，或者内容完全一致。\u003c/div>';\n    } else {\n      var frag = document.createDocumentFragment();\n      for (var i = 0; i \u003c display.length; i++) frag.appendChild(build(display[i]));\n      view.textContent = '';\n      view.appendChild(frag);\n    }\n\n    $('detailMeta').textContent = '+' + res.add + ' −' + res.del + ' ~' + res.mod +\n      ' · 左 ' + aLines.length + ' 行 / 右 ' + bLines.length + ' 行 · ' + lastCost + 'ms' +\n      (res.degraded ? ' · ⚠ 已降级对齐，行对应仅供参考' : '');\n  }\n\n  function openDetail() {\n    clearTimeout(timer);\n    var res = refresh();\n    // 面板是全屏覆盖层，但焦点可能还留在 textarea 上：\n    // 不锁住的话用户继续打字会写进看不见的输入框，关闭后统计/高亮全是旧值。\n    taL.readOnly = true;\n    taR.readOnly = true;\n    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();\n    $('detail').hidden = false;\n    renderDetail(res);\n    var view = $('diffView');\n    var n = (res && res.blocks) ? res.blocks.length : 0;\n    if (!n) { view.scrollTop = 0; return; }\n    if (curBlock \u003c 0) curBlock = 0;\n    var el = view.querySelector('[data-block=\"' + curBlock + '\"]');\n    // 首屏定位到差异处顶部（不居中，保留上方上下文）\n    if (el) view.scrollTop = Math.max(0, el.offsetTop - view.offsetTop - 32);\n    $('navPos').textContent = (curBlock + 1) + '/' + n;\n  }\n\n  function closeDetail() {\n    var wasOpen = !$('detail').hidden;\n    $('detail').hidden = true;\n    taL.readOnly = false;\n    taR.readOnly = false;\n    // refresh() 在面板打开期间是短路返回的，这里必须补算一次，\n    // 否则关闭瞬间的统计/行数/三层高亮还是打开前的旧值。\n    if (wasOpen) refresh();\n  }\n\n  $('btnDetail').addEventListener('click', openDetail);\n  $('btnCloseDetail').addEventListener('click', closeDetail);\n  $('optFold').addEventListener('change', function () {\n    renderDetail(lastRes || refresh());\n  });\n  $('navPrev').addEventListener('click', function () { gotoBlock(-1); });\n  $('navNext').addEventListener('click', function () { gotoBlock(1); });\n\n  /* =========================================================\n   * 5. 交互\n   * =======================================================*/\n  [taL, taR].forEach(function (ta) {\n    var side = (ta === taL) ? 'L' : 'R';\n\n    ta.addEventListener('input', scheduleRefresh);\n    ta.addEventListener('paste', function () { setTimeout(scheduleRefresh, 0); });\n    ta.addEventListener('cut', function () { setTimeout(scheduleRefresh, 0); });\n    ta.addEventListener('scroll', function () { syncScroll(side); });\n\n    ta.addEventListener('keydown', function (e) {\n      if (e.key === 'Tab') {\n        e.preventDefault();\n        document.execCommand('insertText', false, '    ');\n        scheduleRefresh();\n      }\n    });\n\n    ta.addEventListener('dragover', function (e) { e.preventDefault(); ta.classList.add('drag'); });\n    ta.addEventListener('dragleave', function () { ta.classList.remove('drag'); });\n    ta.addEventListener('drop', function (e) {\n      e.preventDefault();\n      ta.classList.remove('drag');\n      if (e.dataTransfer.files && e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0], ta);\n    });\n  });\n\n  /* =========================================================\n   * 4.5 文件解码：UTF-8 / GBK 自动识别\n   * =======================================================*/\n  var rawBuf = { L: null, R: null };     // 原始 ArrayBuffer，供手动切换编码时复用\n  var encMode = { L: 'auto', R: 'auto' };\n  var lastDecoded = { L: '', R: '' };    // 上次解码产出的文本，用于识别「是否被手工改过」\n\n  function tryDecode(bytes, label, fatal) {\n    try {\n      return new TextDecoder(label, fatal ? { fatal: true } : undefined).decode(bytes);\n    } catch (e) {\n      return null;   // 非法字节序列，或该环境不支持此编码标签\n    }\n  }\n\n  /* 解码 + 清洗：剥 BOM、去 NUL。BOM 不剥会让首行「看起来一样却被判为修改」。 */\n  function decodeBuffer(buf, mode) {\n    var text = null;\n    if (typeof TextDecoder === 'undefined') {\n      // 极端老环境兜底：按 UTF-8 近似处理\n      text = String.fromCharCode.apply(null, new Uint8Array(buf));\n    } else {\n      var bytes = new Uint8Array(buf);\n      // 严格 UTF-8 解得通 = 基本可以确定就是 UTF-8。\n      // 手选 GBK 时也优先采信它，避免把 UTF-8 中文解成「涓枃娴嬭瘯」这类乱码且毫无提示。\n      var strict = tryDecode(bytes, 'utf-8', true);\n      if (mode === 'gbk') {\n        text = (strict != null && strict.indexOf('\\uFFFD') \u003c 0) ? strict : tryDecode(bytes, 'gbk', false);\n      } else if (mode === 'utf-8') {\n        text = (strict != null) ? strict : tryDecode(bytes, 'utf-8', false);\n      } else {\n        text = strict;\n        if (text == null) text = tryDecode(bytes, 'gbk', false);\n        if (text == null) text = tryDecode(bytes, 'utf-8', false);\n      }\n    }\n    if (text == null) text = '';\n    return text.replace(/^\\uFEFF/, '').replace(/\\u0000/g, '');\n  }\n\n  /* 把原始字节解码后写入该侧。\n     force=true（载入新文件）跳过「丢弃手工修改」确认；nextMode 为本次要切换到的编码。\n     返回 false 表示用户在确认框里取消了。 */\n  function applyBuffer(side, force, nextMode) {\n    var ta = side === 'L' ? taL : taR;\n    var buf = rawBuf[side];\n    if (!buf) { if (nextMode != null) encMode[side] = nextMode; return true; }\n    // 先确认、后落状态：否则用户取消后 encMode 已经被改掉，下拉框回退不回去\n    if (!force && ta.value !== lastDecoded[side]) {\n      if (!window.confirm('切换编码会丢弃该侧的手工修改，继续？')) return false;\n    }\n    if (nextMode != null) encMode[side] = nextMode;\n    ta.value = decodeBuffer(buf, encMode[side]);\n    lastDecoded[side] = ta.value;\n    ta.scrollTop = 0;\n    ta.scrollLeft = 0;\n    curBlock = -1;              // 内容整体换掉了，导航位置复位\n    refresh();\n    return true;\n  }\n\n  function loadFile(file, ta) {\n    var side = (ta === taL) ? 'L' : 'R';\n    if (file.size > 20 * 1024 * 1024) alert('文件超过 20MB，加载可能较慢，请稍候。');\n    var reader = new FileReader();\n    reader.onload = function () {\n      rawBuf[side] = reader.result;\n      // 手动选定的编码只对当前这份内容有效：换文件一律回到「自动」，\n      // 否则上一份手选的 GBK 会让这份 UTF-8 文件静默变成乱码。\n      encMode[side] = 'auto';\n      (side === 'L' ? $('encL') : $('encR')).value = 'auto';\n      applyBuffer(side, true);\n    };\n    reader.onerror = function () { alert('文件读取失败：' + file.name); };\n    reader.readAsArrayBuffer(file);\n  }\n\n  $('encL').addEventListener('change', function (e) {\n    if (!applyBuffer('L', false, e.target.value)) e.target.value = encMode.L;\n  });\n  $('encR').addEventListener('change', function (e) {\n    if (!applyBuffer('R', false, e.target.value)) e.target.value = encMode.R;\n  });\n\n  $('fileL').addEventListener('change', function (e) {\n    if (e.target.files[0]) loadFile(e.target.files[0], taL);\n    e.target.value = '';\n  });\n  $('fileR').addEventListener('change', function (e) {\n    if (e.target.files[0]) loadFile(e.target.files[0], taR);\n    e.target.value = '';\n  });\n\n  Array.prototype.forEach.call(document.querySelectorAll('[data-clear]'), function (btn) {\n    btn.addEventListener('click', function () {\n      var side = btn.getAttribute('data-clear');\n      var ta = side === 'L' ? taL : taR;\n      ta.value = '';\n      ta.scrollTop = 0;\n      ta.scrollLeft = 0;\n      rawBuf[side] = null;      // 清掉原始字节，避免切编码时文本又冒回来\n      lastDecoded[side] = '';\n      curBlock = -1;\n      refresh();\n      ta.focus();\n    });\n  });\n\n  $('btnSwap').addEventListener('click', function () {\n    var tmp = taL.value; taL.value = taR.value; taR.value = tmp;\n    var tb = rawBuf.L; rawBuf.L = rawBuf.R; rawBuf.R = tb;\n    var tm = encMode.L; encMode.L = encMode.R; encMode.R = tm;\n    var td = lastDecoded.L; lastDecoded.L = lastDecoded.R; lastDecoded.R = td;\n    $('encL').value = encMode.L;\n    $('encR').value = encMode.R;\n    taL.scrollTop = 0; taR.scrollTop = 0;\n    taL.scrollLeft = 0; taR.scrollLeft = 0;\n    curBlock = -1;\n    refresh();\n  });\n\n  $('btnClear').addEventListener('click', function () {\n    taL.value = ''; taR.value = '';\n    rawBuf.L = null; rawBuf.R = null;\n    curBlock = -1;\n    refresh();\n    taL.focus();\n  });\n\n  $('btnTheme').addEventListener('click', function () {\n    var root = document.documentElement;\n    var dark = root.getAttribute('data-theme') === 'dark';\n    root.setAttribute('data-theme', dark ? 'light' : 'dark');\n    $('btnTheme').textContent = dark ? '深色' : '浅色';\n  });\n\n  $('optWs').addEventListener('change', scheduleRefresh);\n\n  document.addEventListener('keydown', function (e) {\n    if (e.altKey && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {\n      e.preventDefault();\n      gotoBlock(e.key === 'ArrowDown' ? 1 : -1);\n      return;\n    }\n    if (e.key === 'Escape' && !$('detail').hidden) { closeDetail(); return; }\n    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); openDetail(); }\n  });\n\n  $('btnSample').addEventListener('click', function () {\n    taL.value =\n      'function getUserList(page, size) {\\n' +\n      '  const offset = page * size;\\n' +\n      '  const sql = \"SELECT id, name, email FROM users LIMIT ? OFFSET ?\";\\n' +\n      '  return db.query(sql, [size, offset]);\\n' +\n      '}\\n' +\n      '\\n' +\n      '// 查询用户总数\\n' +\n      'function countUsers() {\\n' +\n      '  return db.query(\"SELECT COUNT(*) FROM users\");\\n' +\n      '}\\n' +\n      '\\n' +\n      'module.exports = { getUserList, countUsers };';\n    taR.value =\n      'function getUserList(page, size) {\\n' +\n      '  const offset = (page - 1) * size;\\n' +\n      '  const sql = \"SELECT id, name, email, status FROM users WHERE deleted_at IS NULL LIMIT ? OFFSET ?\";\\n' +\n      '  return db.query(sql, [size, offset]);\\n' +\n      '}\\n' +\n      '\\n' +\n      '// 查询用户总数（仅统计未删除用户）\\n' +\n      'function countUsers() {\\n' +\n      '  return db.query(\"SELECT COUNT(*) FROM users WHERE deleted_at IS NULL\");\\n' +\n      '}\\n' +\n      '\\n' +\n      'function softDeleteUser(id) {\\n' +\n      '  return db.query(\"UPDATE users SET deleted_at = NOW() WHERE id = ?\", [id]);\\n' +\n      '}\\n' +\n      '\\n' +\n      'module.exports = { getUserList, countUsers, softDeleteUser };';\n    taL.scrollTop = 0; taR.scrollTop = 0;\n    taL.scrollLeft = 0; taR.scrollLeft = 0;\n    curBlock = -1;\n    refresh();\n  });\n\n  refresh();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}</script>
<script>
(function () {
  'use strict';

  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var views = {
    home: document.getElementById('view-home'),
    timesheet: document.getElementById('view-timesheet'),
    diff: document.getElementById('view-diff')
  };
  var frames = {
    timesheet: document.getElementById('frTimesheet'),
    diff: document.getElementById('frDiff')
  };
  var errBox = document.getElementById('errBox');
  var current = 'home';
  var bundle;

  try {
    bundle = JSON.parse(document.getElementById('bundle').textContent);
  } catch (e) {
    bundle = null;
    errBox.className = 'err on';
    errBox.textContent = '内置代码解析失败：' + e.message;
  }

  function storageGet(k) {
    try { return localStorage.getItem(k); } catch (e) { return null; }
  }
  function storageSet(k, v) {
    try { localStorage.setItem(k, v); } catch (e) { /* file:// 或隐私模式，忽略 */ }
  }

  /* srcdoc 文档是 opaque origin，原生 localStorage 不可用。
     注入一层内存实现，并把写入桥接回父页面，保证草稿仍能持久化。 */
  function withStorageBridge(html) {
    var seed = {};
    var saved = storageGet('workbuddy.timesheet.v1');
    if (saved) seed['workbuddy.timesheet.v1'] = saved;

    var shim = '<scr' + 'ipt>(function(){' +
      'var mem=' + JSON.stringify(seed) + ';' +
      'function Api(){}' +
      'Api.prototype.getItem=function(k){return Object.prototype.hasOwnProperty.call(mem,k)?mem[k]:null;};' +
      'Api.prototype.setItem=function(k,v){mem[k]=String(v);try{parent.postMessage({__tb:1,k:k,v:String(v)},"*");}catch(e){}};' +
      'Api.prototype.removeItem=function(k){delete mem[k];};' +
      'Api.prototype.clear=function(){mem={};};' +
      'try{Object.defineProperty(window,"localStorage",{configurable:true,get:function(){return new Api();}});}catch(e){}' +
      '})();</scr' + 'ipt>';

    return html.replace('<head>', '<head>' + shim);
  }

  function docFor(name) {
    if (!bundle || !bundle[name]) return '';
    if (name === 'timesheet') return withStorageBridge(bundle[name]);
    return bundle[name];
  }

  function loadFrame(name) {
    var f = frames[name];
    if (!f || f.getAttribute('data-loaded')) return;
    var doc = docFor(name);
    if (!doc) {
      errBox.className = 'err on';
      errBox.textContent = '未找到「' + name + '」的内置代码，文件可能被截断。';
      return;
    }
    f.setAttribute('srcdoc', doc);
    f.setAttribute('data-loaded', '1');
  }

  function urlFor(name) {
    return name === 'home' ? location.pathname + location.search : '#' + name;
  }

  /* push：新增一条历史记录（浏览器后退可回到上一屏）；replace：改写当前记录，不留痕 */
  function writeHistory(name, how) {
    try {
      if (how === 'push') history.pushState({ tab: name }, '', urlFor(name));
      else history.replaceState({ tab: name }, '', urlFor(name));
    } catch (e) {
      /* file:// 下个别浏览器可能限制 pushState，退化为 hash 导航 */
      try { location.hash = name === 'home' ? 'home' : name; } catch (e2) { }
    }
  }

  function go(name, how) {
    if (!views[name]) name = 'home';
    if (how === undefined) how = 'push';
    var changed = current !== name;
    current = name;
    tabs.forEach(function (t) { t.classList.toggle('on', t.getAttribute('data-tab') === name); });
    Object.keys(views).forEach(function (k) { views[k].classList.toggle('on', k === name); });
    if (name !== 'home') loadFrame(name);
    if (how === 'push') {
      if (changed) writeHistory(name, 'push');
    } else if (how === 'replace') {
      writeHistory(name, 'replace');
    }
  }

  function syncFromUrl() {
    var name = (location.hash || '').replace('#', '');
    go(name && views[name] ? name : 'home', 'none');
  }

  tabs.forEach(function (t) {
    t.addEventListener('click', function () { go(t.getAttribute('data-tab')); });
  });

  Array.prototype.slice.call(document.querySelectorAll('[data-open]')).forEach(function (b) {
    b.addEventListener('click', function () { go(b.getAttribute('data-open')); });
  });

  document.addEventListener('keydown', function (e) {
    if (!e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === '1') { go('home'); e.preventDefault(); }
    else if (e.key === '2') { go('timesheet'); e.preventDefault(); }
    else if (e.key === '3') { go('diff'); e.preventDefault(); }
  });

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.__tb !== 1) return;
    storageSet(d.k, d.v);
  });

  window.addEventListener('popstate', syncFromUrl);
  window.addEventListener('hashchange', syncFromUrl);

  var hash = (location.hash || '').replace('#', '');
  go(hash && views[hash] ? hash : 'home', 'none');

  window.__toolbox = {
    go: go,
    current: function () { return current; },
    bundleSize: function () { return bundle ? (bundle.timesheet.length + bundle.diff.length) : 0; }
  };
})();
</script>
</body>
